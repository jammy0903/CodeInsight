<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeInsight - Legal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 60px 48px;
            max-width: 500px;
            width: 100%;
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 8px;
        }
        h1 {
            color: #5a4fcf;
            font-size: 2.5rem;
            margin-bottom: 8px;
        }
        .tagline {
            color: #888;
            margin-bottom: 48px;
            font-size: 1.1rem;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .link-btn {
            display: block;
            padding: 18px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .link-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .contact {
            margin-top: 48px;
            color: #888;
            font-size: 0.9rem;
        }
        .contact a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💡</div>
        <h1>CodeInsight</h1>
        <p class="tagline">코드의 원리를 눈으로 이해하다</p>

        <div class="links">
            <a href="terms.html" class="link-btn">Terms & Conditions</a>
            <a href="privacy.html" class="link-btn">Privacy Policy</a>
        </div>

        <div class="contact">
            <p>Contact: <a href="mailto:l89192164@gmail.com">l89192164@gmail.com</a></p>
        </div>
    </div>
</body>
</html>
