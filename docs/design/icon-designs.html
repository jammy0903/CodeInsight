<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CodeInsight Icon Designs</title>
<style>
  body { background: #1a1a2e; display: flex; flex-wrap: wrap; gap: 40px; padding: 40px; justify-content: center; font-family: sans-serif; }
  .card { text-align: center; }
  .card p { color: #aaa; margin-top: 12px; font-size: 14px; }
  svg { filter: drop-shadow(0 4px 20px rgba(0,0,0,0.5)); }
</style>
</head>
<body>

<!-- Design 1: 코드 브라켓 + 눈(인사이트) -->
<div class="card">
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cyan1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="softglow1">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg1)"/>
  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#818cf8" stroke-width="1">
    <line x1="128" y1="0" x2="128" y2="512"/><line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/><line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/><line x1="0" y1="384" x2="512" y2="384"/>
  </g>
  <!-- Left bracket { -->
  <text x="100" y="320" font-family="'SF Mono','Fira Code',monospace" font-size="220" font-weight="700" fill="url(#glow1)" filter="url(#softglow1)" opacity="0.9">{</text>
  <!-- Right bracket } -->
  <text x="320" y="320" font-family="'SF Mono','Fira Code',monospace" font-size="220" font-weight="700" fill="url(#glow1)" filter="url(#softglow1)" opacity="0.9">}</text>
  <!-- Eye/lens in center -->
  <ellipse cx="256" cy="256" rx="65" ry="42" fill="none" stroke="url(#cyan1)" stroke-width="6" filter="url(#softglow1)"/>
  <circle cx="256" cy="256" r="22" fill="url(#cyan1)"/>
  <circle cx="256" cy="256" r="10" fill="#0f172a"/>
  <circle cx="249" cy="250" r="5" fill="rgba(255,255,255,0.6)"/>
</svg>
<p>1. 코드 브라켓 + 눈</p>
</div>

<!-- Design 2: CI 모노그램 -->
<div class="card">
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0a1d"/>
      <stop offset="100%" stop-color="#1a1145"/>
    </linearGradient>
    <linearGradient id="purple2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="teal2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="softglow2">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg2)"/>
  <!-- C letter -->
  <path d="M 230 160 Q 130 160 130 256 Q 130 352 230 352" fill="none" stroke="url(#purple2)" stroke-width="32" stroke-linecap="round" filter="url(#softglow2)"/>
  <!-- I letter integrated as cursor/line -->
  <line x1="310" y1="150" x2="310" y2="362" stroke="url(#teal2)" stroke-width="28" stroke-linecap="round" filter="url(#softglow2)"/>
  <!-- Dot/insight spark on the I -->
  <circle cx="310" cy="120" r="18" fill="#2dd4bf" filter="url(#softglow2)"/>
  <!-- Small code lines decoration -->
  <g opacity="0.3" stroke="#a78bfa" stroke-width="3" stroke-linecap="round">
    <line x1="80" y1="420" x2="130" y2="420"/>
    <line x1="80" y1="440" x2="160" y2="440"/>
    <line x1="80" y1="460" x2="120" y2="460"/>
    <line x1="350" y1="420" x2="430" y2="420"/>
    <line x1="350" y1="440" x2="410" y2="440"/>
    <line x1="350" y1="460" x2="440" y2="460"/>
  </g>
</svg>
<p>2. CI 모노그램</p>
</div>

<!-- Design 3: 돋보기 + 코드 -->
<div class="card">
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lens3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="handle3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="softglow3">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lensClip"><circle cx="220" cy="220" r="110"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg3)"/>
  <!-- Code lines in background -->
  <g opacity="0.15" stroke="#818cf8" stroke-width="3" stroke-linecap="round">
    <line x1="60" y1="100" x2="180" y2="100"/>
    <line x1="80" y1="130" x2="240" y2="130"/>
    <line x1="80" y1="160" x2="200" y2="160"/>
    <line x1="60" y1="190" x2="160" y2="190"/>
    <line x1="80" y1="280" x2="220" y2="280"/>
    <line x1="80" y1="310" x2="280" y2="310"/>
    <line x1="60" y1="340" x2="180" y2="340"/>
    <line x1="80" y1="370" x2="240" y2="370"/>
  </g>
  <!-- Magnifying glass lens -->
  <circle cx="220" cy="220" r="110" fill="none" stroke="url(#lens3)" stroke-width="10" filter="url(#softglow3)"/>
  <!-- Inside lens: highlighted code -->
  <g clip-path="url(#lensClip)">
    <rect x="110" y="110" width="220" height="220" fill="rgba(129,140,248,0.08)"/>
    <g stroke-linecap="round" stroke-width="5">
      <line x1="145" y1="180" x2="200" y2="180" stroke="#22d3ee"/>
      <line x1="205" y1="180" x2="275" y2="180" stroke="#a78bfa"/>
      <line x1="160" y1="210" x2="230" y2="210" stroke="#f472b6"/>
      <line x1="235" y1="210" x2="285" y2="210" stroke="#34d399"/>
      <line x1="160" y1="240" x2="195" y2="240" stroke="#fbbf24"/>
      <line x1="200" y1="240" x2="270" y2="240" stroke="#22d3ee"/>
      <line x1="145" y1="270" x2="180" y2="270" stroke="#a78bfa"/>
    </g>
  </g>
  <!-- Glass reflection -->
  <ellipse cx="180" cy="175" rx="40" ry="15" fill="rgba(255,255,255,0.08)" transform="rotate(-30,180,175)"/>
  <!-- Handle -->
  <line x1="300" y1="300" x2="410" y2="410" stroke="url(#handle3)" stroke-width="30" stroke-linecap="round" filter="url(#softglow3)"/>
</svg>
<p>3. 돋보기 + 코드</p>
</div>

<!-- Design 4: 미니멀 브라켓 + 전구 -->
<div class="card">
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bracket4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="bulbglow">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg4)"/>
  <!-- Angle brackets < /> -->
  <text x="68" y="310" font-family="'SF Mono','Fira Code',monospace" font-size="180" font-weight="300" fill="url(#bracket4)" opacity="0.7">&lt;</text>
  <text x="310" y="310" font-family="'SF Mono','Fira Code',monospace" font-size="180" font-weight="300" fill="url(#bracket4)" opacity="0.7">/&gt;</text>
  <!-- Lightbulb in center -->
  <g filter="url(#bulbglow)">
    <!-- Bulb body -->
    <path d="M 256 140 Q 310 140 310 210 Q 310 250 280 270 L 280 300 L 232 300 L 232 270 Q 202 250 202 210 Q 202 140 256 140 Z" fill="url(#accent4)"/>
    <!-- Bulb base -->
    <rect x="232" y="300" width="48" height="8" rx="2" fill="#d4d4d8"/>
    <rect x="236" y="312" width="40" height="6" rx="2" fill="#a1a1aa"/>
    <rect x="240" y="322" width="32" height="6" rx="2" fill="#a1a1aa"/>
    <!-- Bottom tip -->
    <path d="M 244 328 Q 256 340 268 328" fill="#a1a1aa"/>
  </g>
  <!-- Light rays -->
  <g stroke="#fbbf24" stroke-width="3" opacity="0.4" stroke-linecap="round">
    <line x1="256" y1="100" x2="256" y2="115"/>
    <line x1="180" y1="130" x2="190" y2="142"/>
    <line x1="332" y1="130" x2="322" y2="142"/>
    <line x1="160" y1="200" x2="175" y2="205"/>
    <line x1="352" y1="200" x2="337" y2="205"/>
  </g>
</svg>
<p>4. 코드 태그 + 전구</p>
</div>

<!-- Design 5: 터미널 스타일 -->
<div class="card">
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg5)"/>
  <!-- Terminal window -->
  <rect x="60" y="80" width="392" height="352" rx="20" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Title bar -->
  <rect x="60" y="80" width="392" height="40" rx="20" fill="#334155"/>
  <rect x="60" y="100" width="392" height="20" fill="#334155"/>
  <circle cx="92" cy="100" r="8" fill="#ef4444"/>
  <circle cx="118" cy="100" r="8" fill="#eab308"/>
  <circle cx="144" cy="100" r="8" fill="#22c55e"/>
  <!-- Code lines -->
  <g filter="url(#glow5)">
    <!-- Line 1: prompt -->
    <text x="90" y="165" font-family="'SF Mono','Fira Code',monospace" font-size="22" fill="#22d3ee">$</text>
    <text x="115" y="165" font-family="'SF Mono','Fira Code',monospace" font-size="22" fill="#e2e8f0">run insight</text>
    <!-- Line 2 -->
    <text x="90" y="205" font-family="'SF Mono','Fira Code',monospace" font-size="20" fill="#34d399">&#x2713;</text>
    <text x="115" y="205" font-family="'SF Mono','Fira Code',monospace" font-size="20" fill="#94a3b8">analyzing...</text>
    <!-- Line 3: highlighted -->
    <rect x="80" y="218" width="340" height="32" rx="4" fill="rgba(129,140,248,0.15)"/>
    <text x="90" y="242" font-family="'SF Mono','Fira Code',monospace" font-size="20" fill="#818cf8">int x = 5;</text>
    <text x="260" y="242" font-family="'SF Mono','Fira Code',monospace" font-size="18" fill="#fbbf24">// Stack[x:5]</text>
    <!-- Line 4 -->
    <rect x="80" y="254" width="340" height="32" rx="4" fill="rgba(129,140,248,0.08)"/>
    <text x="90" y="278" font-family="'SF Mono','Fira Code',monospace" font-size="20" fill="#e2e8f0">int y = x+3;</text>
    <text x="280" y="278" font-family="'SF Mono','Fira Code',monospace" font-size="18" fill="#fbbf24">// Stack[y:8]</text>
    <!-- Line 5: cursor -->
    <text x="90" y="320" font-family="'SF Mono','Fira Code',monospace" font-size="22" fill="#22d3ee">$</text>
    <rect x="115" y="305" width="14" height="22" fill="#22d3ee" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
<p>5. 터미널 스타일</p>
</div>

<!-- Design 6: 미니멀 추상 -->
<div class="card">
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg6)"/>
  <!-- Abstract flowing lines representing code flow -->
  <g fill="none" stroke="white" stroke-linecap="round" filter="url(#glow6)">
    <!-- Main flow lines -->
    <path d="M 100 180 Q 200 140 256 200 Q 312 260 412 220" stroke-width="6" opacity="0.9"/>
    <path d="M 100 256 Q 200 216 256 256 Q 312 296 412 256" stroke-width="8" opacity="1"/>
    <path d="M 100 332 Q 200 372 256 312 Q 312 252 412 292" stroke-width="6" opacity="0.9"/>
  </g>
  <!-- Center node/insight point -->
  <circle cx="256" cy="256" r="30" fill="white" opacity="0.95"/>
  <circle cx="256" cy="256" r="18" fill="url(#bg6)"/>
  <circle cx="256" cy="256" r="8" fill="white"/>
  <!-- Small nodes -->
  <circle cx="140" cy="230" r="8" fill="white" opacity="0.5"/>
  <circle cx="372" cy="240" r="8" fill="white" opacity="0.5"/>
  <circle cx="180" cy="310" r="6" fill="white" opacity="0.4"/>
  <circle cx="340" cy="200" r="6" fill="white" opacity="0.4"/>
</svg>
<p>6. 그라데이션 플로우</p>
</div>

</body>
</html>
