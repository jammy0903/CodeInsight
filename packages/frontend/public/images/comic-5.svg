<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="400" height="400" fill="#fffbf5"/>

  <!-- AI 로봇 -->
  <rect x="150" y="80" width="100" height="80" rx="15" fill="#e5d5c7"/>
  <circle cx="180" cy="110" r="12" fill="#6b5a4a"/>
  <circle cx="220" cy="110" r="12" fill="#6b5a4a"/>
  <rect x="175" y="135" width="50" height="10" rx="5" fill="#6b5a4a"/>

  <!-- 안테나 -->
  <line x1="200" y1="80" x2="200" y2="60" stroke="#a08060" stroke-width="3"/>
  <circle cx="200" cy="55" r="8" fill="#a08060"/>

  <!-- AI 말풍선 -->
  <rect x="80" y="180" width="240" height="70" rx="15" fill="white" stroke="#a08060" stroke-width="2"/>
  <text x="200" y="210" text-anchor="middle" font-size="14" fill="#6b5a4a">*p는 p가 가리키는</text>
  <text x="200" y="235" text-anchor="middle" font-size="14" fill="#6b5a4a">메모리의 값을 읽어요!</text>

  <!-- 사용자 반응 -->
  <rect x="100" y="280" width="200" height="80" rx="15" fill="#e5d5c7"/>
  <text x="200" y="315" text-anchor="middle" font-size="16" fill="#6b5a4a">💡 아하!</text>
  <text x="200" y="340" text-anchor="middle" font-size="14" fill="#937b5d">드디어 이해했다</text>
</svg>
