<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="400" height="400" fill="#fffbf5"/>

  <!-- 메모리 시각화 박스 -->
  <rect x="80" y="100" width="240" height="180" rx="10" fill="white" stroke="#a08060" stroke-width="3"/>

  <!-- Stack 라벨 -->
  <text x="200" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#6b5a4a">Stack</text>

  <!-- 메모리 블록들 -->
  <rect x="100" y="145" width="200" height="35" fill="#e5d5c7" stroke="#a08060" stroke-width="2"/>
  <text x="120" y="168" font-size="14" fill="#6b5a4a">int x = 10</text>
  <text x="260" y="168" font-size="14" fill="#a08060">10</text>

  <rect x="100" y="185" width="200" height="35" fill="#e5d5c7" stroke="#a08060" stroke-width="2"/>
  <text x="120" y="208" font-size="14" fill="#6b5a4a">int *p = &amp;x</text>
  <text x="250" y="208" font-size="14" fill="#a08060">→</text>

  <!-- 화살표 -->
  <path d="M 270 202 Q 320 180 270 165" stroke="#a08060" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- 말풍선 -->
  <rect x="50" y="300" width="300" height="60" rx="15" fill="white" stroke="#e5d5c7" stroke-width="2"/>
  <text x="200" y="335" text-anchor="middle" font-size="18" fill="#6b5a4a">오 이게 포인터구나!</text>
</svg>
