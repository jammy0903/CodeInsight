<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 (축하 분위기) -->
  <rect width="400" height="400" fill="#fffbf5"/>

  <!-- 별들 -->
  <text x="80" y="80" font-size="30">⭐</text>
  <text x="300" y="100" font-size="25">✨</text>
  <text x="50" y="200" font-size="20">🎉</text>
  <text x="330" y="250" font-size="25">🎊</text>

  <!-- 캐릭터 (기뻐하는) -->
  <circle cx="200" cy="180" r="70" fill="#e5d5c7"/>
  <circle cx="175" cy="165" r="10" fill="#6b5a4a"/>
  <circle cx="225" cy="165" r="10" fill="#6b5a4a"/>
  <path d="M 165 200 Q 200 230 235 200" stroke="#6b5a4a" stroke-width="5" fill="none"/>

  <!-- 손 들기 -->
  <line x1="130" y1="180" x2="100" y2="120" stroke="#e5d5c7" stroke-width="15" stroke-linecap="round"/>
  <line x1="270" y1="180" x2="300" y2="120" stroke="#e5d5c7" stroke-width="15" stroke-linecap="round"/>

  <!-- 말풍선 -->
  <rect x="70" y="290" width="260" height="70" rx="15" fill="white" stroke="#a08060" stroke-width="3"/>
  <text x="200" y="320" text-anchor="middle" font-size="18" font-weight="bold" fill="#6b5a4a">C언어 마스터!</text>
  <text x="200" y="345" text-anchor="middle" font-size="14" fill="#937b5d">2주만에 해냈다 🔥</text>
</svg>
