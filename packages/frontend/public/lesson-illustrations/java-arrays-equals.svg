<svg width="1200" height="680" viewBox="0 0 1200 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="680" fill="url(#bg)"/>

  <text x="60" y="70" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#9a3412">
    Arrays.equals(arr1, arr2) = true
  </text>
  <text x="60" y="112" font-family="Arial, sans-serif" font-size="24" fill="#7c2d12">
    주소가 아니라 각 인덱스의 값을 순서대로 비교합니다.
  </text>

  <rect x="80" y="180" width="260" height="110" rx="14" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
  <text x="100" y="225" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#c2410c">arr1</text>
  <text x="100" y="262" font-family="Arial, sans-serif" font-size="24" fill="#9a3412">-&gt; 0x001</text>

  <rect x="80" y="325" width="260" height="110" rx="14" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
  <text x="100" y="370" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#c2410c">arr2</text>
  <text x="100" y="407" font-family="Arial, sans-serif" font-size="24" fill="#9a3412">-&gt; 0x002</text>

  <rect x="520" y="170" width="560" height="130" rx="16" fill="#ffffff" stroke="#fb923c" stroke-width="3"/>
  <text x="545" y="210" font-family="Arial, sans-serif" font-size="24" fill="#9a3412">0x001</text>
  <rect x="640" y="190" width="110" height="80" rx="10" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/>
  <rect x="770" y="190" width="110" height="80" rx="10" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/>
  <rect x="900" y="190" width="110" height="80" rx="10" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/>
  <text x="685" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#7c2d12">1</text>
  <text x="815" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#7c2d12">2</text>
  <text x="945" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#7c2d12">3</text>

  <rect x="520" y="340" width="560" height="130" rx="16" fill="#ffffff" stroke="#fb923c" stroke-width="3"/>
  <text x="545" y="380" font-family="Arial, sans-serif" font-size="24" fill="#9a3412">0x002</text>
  <rect x="640" y="360" width="110" height="80" rx="10" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/>
  <rect x="770" y="360" width="110" height="80" rx="10" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/>
  <rect x="900" y="360" width="110" height="80" rx="10" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/>
  <text x="685" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#7c2d12">1</text>
  <text x="815" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#7c2d12">2</text>
  <text x="945" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#7c2d12">3</text>

  <line x1="340" y1="235" x2="520" y2="235" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="340" y1="380" x2="520" y2="405" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="640" y="545" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#b45309">
    index 0: 1==1, index 1: 2==2, index 2: 3==3
  </text>
  <text x="640" y="588" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#15803d">
    All elements match → true
  </text>
