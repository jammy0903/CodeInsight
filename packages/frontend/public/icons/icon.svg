<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbf5"/>
      <stop offset="100%" style="stop-color:#f5ebe0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Code brackets -->
  <text x="256" y="300" font-family="monospace" font-size="200" font-weight="bold" fill="#a08060" text-anchor="middle">&lt;/&gt;</text>
  <!-- Lightbulb dot -->
  <circle cx="256" cy="140" r="40" fill="#FFD700"/>
  <!-- Rays -->
  <g stroke="#FFD700" stroke-width="8" stroke-linecap="round">
    <line x1="256" y1="80" x2="256" y2="60"/>
    <line x1="296" y1="100" x2="316" y2="80"/>
    <line x1="216" y1="100" x2="196" y2="80"/>
  </g>
</svg>
