<!DOCTYPE html>
<html data-theme="dark">
<head>
  <style>
    [data-theme='dark'] {
      --test-bg: #000;
      --test-text: #fff;
    }
    body {
      background: var(--test-bg);
      color: var(--test-text);
    }
  </style>
</head>
<body>
  <h1>테스트</h1>
  <script>
    console.log('data-theme:', document.documentElement.getAttribute('data-theme'));
  </script>
</body>
</html>
