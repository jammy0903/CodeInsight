services:
  postgres:
    image: postgres:16-alpine
    container_name: codeinsight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: codeinsight
      POSTGRES_PASSWORD: codeinsight123
      POSTGRES_DB: codeinsight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeinsight -d codeinsight"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
