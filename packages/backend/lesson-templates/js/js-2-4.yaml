lessonId: "js-2-4"
title: "배열 메서드 (map, filter)"
concept: "map은 배열의 각 요소를 변환하고, filter는 조건에 맞는 요소만 걸러냅니다."

code: |
  let nums = [1, 2, 3, 4, 5];

  let doubled = nums.map((n) => n * 2);
  console.log("2배:", doubled);

  let evens = nums.filter((n) => n % 2 === 0);
  console.log("짝수:", evens);

  let evenDoubled = nums
      .filter((n) => n % 2 === 0)
      .map((n) => n * 2);
  console.log("짝수의 2배:", evenDoubled);

annotations:
  - line: 1
    title: "원본 배열"
    explanation: |
      **`let nums = [1, 2, 3, 4, 5];`**

      변환할 원본 배열을 생성합니다.

  - line: 3
    title: "map으로 변환"
    explanation: |
      **`let doubled = nums.map((n) => n * 2);`**

      **map()**: 배열의 **모든 요소를 변환**하여 새 배열을 반환합니다.

      - 원본: `[1, 2, 3, 4, 5]`
      - 변환: 각 요소 × 2
      - 결과: `[2, 4, 6, 8, 10]`

      **원본 배열은 변경되지 않습니다!** (불변성)

  - line: 4
    title: "map 결과 출력"
    explanation: |
      **`console.log("2배:", doubled);`**

      **출력 결과**: `2배: [ 2, 4, 6, 8, 10 ]`

  - line: 6
    title: "filter로 필터링"
    explanation: |
      **`let evens = nums.filter((n) => n % 2 === 0);`**

      **filter()**: 조건에 맞는 요소만 **걸러서** 새 배열을 반환합니다.

      - 조건: `n % 2 === 0` (짝수인가?)
      - 1 → false, 2 → **true**, 3 → false, 4 → **true**, 5 → false
      - 결과: `[2, 4]`

  - line: 7
    title: "filter 결과 출력"
    explanation: |
      **`console.log("짝수:", evens);`**

      **출력 결과**: `짝수: [ 2, 4 ]`

  - line: 9
    title: "메서드 체이닝"
    explanation: |
      **`nums.filter(...).map(...)`**

      **메서드 체이닝**: 여러 배열 메서드를 연결합니다.

      1. `filter((n) => n % 2 === 0)`: 짝수만 → `[2, 4]`
      2. `.map((n) => n * 2)`: 각 요소 × 2 → `[4, 8]`

      순서가 중요합니다! filter → map은 효율적 (요소 수 줄인 후 변환)

  - line: 12
    title: "체이닝 결과 출력"
    explanation: |
      **`console.log("짝수의 2배:", evenDoubled);`**

      **출력 결과**: `짝수의 2배: [ 4, 8 ]`

quiz:
  question: "[1,2,3].map(x => x > 1)의 결과는?"
  options:
    - "[2, 3]"
    - "[false, true, true]"
    - "[1]"
    - "에러"
  correctIndex: 1
  explanation: |
    **map은 변환**, filter는 필터링입니다!

    `x => x > 1`은 각 요소를 boolean으로 **변환**합니다:
    - 1 > 1 → false
    - 2 > 1 → true
    - 3 > 1 → true

    결과: **[false, true, true]**

    `[2, 3]`을 원한다면 **filter**를 사용해야 합니다!

misconceptions:
  - wrong: "map과 filter는 원본 배열을 변경한다"
    correct: "map과 filter는 새 배열을 반환하며 원본은 변경하지 않습니다."
    why: "불변성(immutability)을 유지하여 예측 가능한 코드를 작성할 수 있습니다."

  - wrong: "map과 filter의 역할이 같다"
    correct: "map은 변환(transform), filter는 필터링(selection)입니다."
    why: "map은 모든 요소를 변환하고, filter는 조건에 맞는 요소만 선택합니다."

keyTakeaway: "map: 모든 요소 변환. filter: 조건에 맞는 요소 선택. 원본 불변. 체이닝으로 조합 가능."
