lessonId: "js-1-8"
title: "함수 선언"
concept: "함수는 재사용 가능한 코드 블록입니다. function 키워드 또는 화살표 함수로 선언합니다."

code: |
  function add(a, b) {
      let result = a + b;
      return result;
  }

  let sum = add(3, 7);
  console.log("3 + 7 =", sum);

  let double = add(sum, sum);
  console.log("sum * 2 =", double);

annotations:
  - line: 1
    title: "함수 선언"
    explanation: |
      **`function add(a, b)`**

      **function 키워드**로 함수를 선언합니다.

      - `add`: 함수 이름
      - `(a, b)`: 매개변수 (타입 명시 불필요!)
      - `{ ... }`: 함수 본문

      **C와 비교**:
      - C: `int add(int a, int b)`
      - JS: `function add(a, b)` (반환 타입, 매개변수 타입 없음)

  - line: 2
    title: "지역 변수"
    explanation: |
      **`let result = a + b;`**

      함수 내부에서 선언된 **지역 변수**입니다.
      함수 밖에서는 접근할 수 없습니다.

  - line: 3
    title: "값 반환"
    explanation: |
      **`return result;`**

      `return`으로 값을 호출한 곳에 반환합니다.

      - return이 없거나 `return;`만 있으면 **undefined** 반환
      - return 후의 코드는 실행되지 않음

  - line: 6
    title: "함수 호출"
    explanation: |
      **`let sum = add(3, 7);`**

      - `add(3, 7)` 호출: a=3, b=7
      - result = 3 + 7 = 10
      - 10이 반환되어 sum에 저장

      **출력**: `3 + 7 = 10`

  - line: 7
    title: "결과 출력"
    explanation: |
      **`console.log("3 + 7 =", sum);`**

      **출력 결과**: `3 + 7 = 10`

  - line: 9
    title: "함수 재사용"
    explanation: |
      **`let double = add(sum, sum);`**

      같은 함수를 다른 인자로 다시 호출합니다.

      - `add(10, 10)` → 20
      - `double = 20`

  - line: 10
    title: "재사용 결과 출력"
    explanation: |
      **`console.log("sum * 2 =", double);`**

      **출력 결과**: `sum * 2 = 20`

      함수의 핵심 가치: **한 번 작성, 여러 번 사용!**

quiz:
  question: "function f() {} 호출 시 반환값은?"
  options:
    - "0"
    - "null"
    - "undefined"
    - "에러"
  correctIndex: 2
  explanation: |
    return문이 없는 함수는 **undefined**를 반환합니다.

    - `return`: undefined 반환
    - `return 값`: 해당 값 반환
    - return 없음: undefined 반환

misconceptions:
  - wrong: "JS 함수는 하나의 값만 반환할 수 있다"
    correct: "객체나 배열을 반환하면 여러 값을 한 번에 반환할 수 있습니다."
    why: "return {x: 1, y: 2} 또는 return [1, 2]로 여러 값을 묶어 반환합니다."

  - wrong: "함수 선언 전에는 호출할 수 없다"
    correct: "function 선언문은 호이스팅되어 선언 전에도 호출 가능합니다."
    why: "JS 엔진이 실행 전에 function 선언을 코드 최상단으로 끌어올립니다(hoisting)."

keyTakeaway: "function으로 함수 선언. 매개변수에 타입 불필요. return 없으면 undefined 반환. 호이스팅 지원."
