lessonId: "js-2-1"
title: "화살표 함수"
concept: "화살표 함수(=>)는 ES6에서 도입된 간결한 함수 표현식입니다."

code: |
  const greet = (name) => {
      return "Hello, " + name + "!";
  };
  console.log(greet("Alice"));

  const square = (x) => x * x;
  console.log("4의 제곱:", square(4));

  const add = (a, b) => a + b;
  console.log("3 + 5 =", add(3, 5));

annotations:
  - line: 1
    title: "화살표 함수 (기본 형태)"
    explanation: |
      **`const greet = (name) => { ... };`**

      **화살표 함수**: `=>` 기호를 사용하는 함수 표현식입니다.

      **구조**: `const 함수명 = (매개변수) => { 본문 };`

      **function 키워드 비교**:
      - 기존: `function greet(name) { ... }`
      - 화살표: `const greet = (name) => { ... }`

  - line: 4
    title: "화살표 함수 호출"
    explanation: |
      **`console.log(greet("Alice"));`**

      일반 함수와 동일한 방법으로 호출합니다.

      **출력 결과**: `Hello, Alice!`

  - line: 6
    title: "한 줄 화살표 함수"
    explanation: |
      **`const square = (x) => x * x;`**

      **본문이 한 줄**이면 중괄호와 return을 생략할 수 있습니다!

      - `(x) => x * x` = `(x) => { return x * x; }`

      매우 간결한 표현이 가능합니다.

  - line: 7
    title: "한 줄 함수 호출"
    explanation: |
      **`console.log("4의 제곱:", square(4));`**

      `square(4)` = 4 * 4 = 16

      **출력 결과**: `4의 제곱: 16`

  - line: 9
    title: "매개변수 2개"
    explanation: |
      **`const add = (a, b) => a + b;`**

      매개변수가 2개 이상이면 괄호 필수입니다.

      `add(3, 5)` = 3 + 5 = 8

  - line: 10
    title: "결과 출력"
    explanation: |
      **`console.log("3 + 5 =", add(3, 5));`**

      **출력 결과**: `3 + 5 = 8`

quiz:
  question: "const f = x => x + 1; 에서 괄호가 없는 이유는?"
  options:
    - "문법 오류이다"
    - "매개변수가 1개면 괄호 생략 가능"
    - "화살표 함수는 괄호가 필요 없다"
    - "const이기 때문"
  correctIndex: 1
  explanation: |
    화살표 함수에서 **매개변수가 딱 1개**이면 괄호를 생략할 수 있습니다.

    - 0개: `() => ...` (괄호 필수)
    - 1개: `x => ...` (괄호 생략 가능)
    - 2개+: `(a, b) => ...` (괄호 필수)

misconceptions:
  - wrong: "화살표 함수와 function은 완전히 같다"
    correct: "화살표 함수는 자신만의 this를 가지지 않습니다."
    why: "화살표 함수는 외부 스코프의 this를 그대로 사용합니다."

  - wrong: "화살표 함수는 항상 function보다 좋다"
    correct: "메서드 정의, 생성자 함수에는 function이 더 적합합니다."
    why: "this 바인딩이 필요한 경우나 호이스팅이 필요한 경우 function이 적합합니다."

keyTakeaway: "화살표 함수: (매개변수) => 표현식. 한 줄이면 {}와 return 생략 가능. 매개변수 1개면 () 생략 가능."
