lessonId: "js-1-7"
title: "반복문 (while)"
concept: "while 문은 조건이 참인 동안 반복합니다. 반복 횟수가 미리 정해지지 않은 경우에 적합합니다."

code: |
  let count = 1;

  while (count <= 4) {
      console.log("count:", count);
      count = count * 2;
  }

  console.log("최종:", count);

annotations:
  - line: 1
    title: "초기값 설정"
    explanation: |
      **`let count = 1;`**

      while 문 바깥에서 반복 변수를 초기화합니다.

  - line: 3
    title: "while 조건 검사"
    explanation: |
      **`while (count <= 4)`**

      현재 `count = 1`, `1 <= 4` → **true** → 블록 실행

      매 반복 시작 전마다 조건을 검사합니다.

  - line: 4
    title: "현재 값 출력"
    explanation: |
      **`console.log("count:", count);`**

      **출력 결과** (첫 반복): `count: 1`

  - line: 5
    title: "값 2배 증가"
    explanation: |
      **`count = count * 2;`**

      **반복 과정**:
      - 1회: count=1 출력, count=1×2=2
      - 2회: count=2 출력, count=2×2=4
      - 3회: count=4 출력, count=4×2=8
      - 검사: count=8, 8 <= 4 → **false** → 종료

  - line: 8
    title: "최종값 출력"
    explanation: |
      **`console.log("최종:", count);`**

      **출력 결과**: `최종: 8`

      count가 8이 되어 조건이 거짓이 되면서 종료되었습니다.

quiz:
  question: "while (true) { ... }는 어떻게 동작하나요?"
  options:
    - "한 번 실행"
    - "실행 안 됨"
    - "무한 반복"
    - "에러 발생"
  correctIndex: 2
  explanation: |
    `true`는 항상 참이므로 **무한 반복**합니다.

    `break`문으로 탈출해야 합니다:
    ```
    while (true) {
      if (조건) break;
    }
    ```

misconceptions:
  - wrong: "while 문은 최소 한 번은 실행된다"
    correct: "while 문은 조건이 처음부터 거짓이면 한 번도 실행되지 않습니다."
    why: "조건을 먼저 검사하기 때문입니다. 최소 한 번 실행하려면 do-while을 사용합니다."

  - wrong: "while과 for는 서로 대체할 수 없다"
    correct: "while과 for는 표현 방식만 다를 뿐 동일한 반복을 할 수 있습니다."
    why: "어떤 for문이든 while문으로 바꿀 수 있고, 그 반대도 가능합니다."

keyTakeaway: "while(조건)은 조건이 참인 동안 반복. 무한 루프 주의. break로 탈출 가능."
