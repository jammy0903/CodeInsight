lessonId: "js-1-6"
title: "반복문 (for)"
concept: "for 문은 초기화, 조건, 증감을 한 줄에 표현합니다. 배열 순회에 자주 사용됩니다."

code: |
  let colors = ["red", "green", "blue"];

  for (let i = 0; i < colors.length; i++) {
      console.log(i + ": " + colors[i]);
  }

  let sum = 0;
  for (let n = 1; n <= 5; n++) {
      sum = sum + n;
  }
  console.log("합계:", sum);

annotations:
  - line: 1
    title: "배열 선언"
    explanation: |
      **`let colors = ["red", "green", "blue"];`**

      순회할 배열을 생성합니다.

  - line: 3
    title: "for 문으로 배열 순회"
    explanation: |
      **`for (let i = 0; i < colors.length; i++)`**

      **for 문의 3요소**:
      1. **초기화**: `let i = 0` → 인덱스를 0부터 시작
      2. **조건**: `i < colors.length` → i가 3 미만이면 계속
      3. **증감**: `i++` → 매 반복마다 i를 1 증가

      배열 순회의 가장 기본적인 패턴입니다.

  - line: 4
    title: "인덱스와 요소 출력"
    explanation: |
      **`console.log(i + ": " + colors[i]);`**

      **출력 결과**:
      - `0: red`
      - `1: green`
      - `2: blue`

  - line: 7
    title: "합계 변수 초기화"
    explanation: |
      **`let sum = 0;`**

      반복문에서 누적할 합계를 0으로 초기화합니다.

  - line: 8
    title: "숫자 합산 for 문"
    explanation: |
      **`for (let n = 1; n <= 5; n++)`**

      1부터 5까지 반복하며 sum에 누적합니다.

      **과정**: 0+1=1, 1+2=3, 3+3=6, 6+4=10, 10+5=15

  - line: 11
    title: "합계 출력"
    explanation: |
      **`console.log("합계:", sum);`**

      **출력 결과**: `합계: 15`

quiz:
  question: "for (let i = 0; i < 3; i++) 에서 i의 값은 차례로?"
  options:
    - "1, 2, 3"
    - "0, 1, 2"
    - "0, 1, 2, 3"
    - "1, 2"
  correctIndex: 1
  explanation: |
    - 시작: `i = 0` (0 < 3 → 실행)
    - 증감: `i = 1` (1 < 3 → 실행)
    - 증감: `i = 2` (2 < 3 → 실행)
    - 증감: `i = 3` (3 < 3 → **종료**)

    따라서 i는 **0, 1, 2** 순으로 실행됩니다.

misconceptions:
  - wrong: "for문 안의 let i는 밖에서도 접근 가능하다"
    correct: "for문 안에서 let으로 선언한 변수는 블록 안에서만 유효합니다."
    why: "let은 블록 스코프이므로 for 블록이 끝나면 i에 접근할 수 없습니다."

  - wrong: "배열 순회에는 for문만 사용할 수 있다"
    correct: "for...of, forEach, map 등 다양한 방법이 있습니다."
    why: "ES6+에서는 for...of가 간결하고, 배열 메서드가 더 함수적입니다."

keyTakeaway: "for(초기화; 조건; 증감)으로 반복. 배열 순회: for(let i=0; i<arr.length; i++). let은 블록 스코프."
