lessonId: "js-1-2"
title: "데이터 타입"
concept: "JavaScript의 기본 타입: number, string, boolean. typeof로 타입을 확인할 수 있습니다."

code: |
  let num = 42;
  let text = "Hello";
  let isActive = true;

  console.log(typeof num);
  console.log(typeof text);
  console.log(typeof isActive);

  let result = num + "점";
  console.log(result);

annotations:
  - line: 1
    title: "숫자 타입 (number)"
    explanation: |
      **`let num = 42;`**

      **number**: 정수와 소수를 모두 포함하는 타입입니다.

      - `42`: 정수
      - `3.14`: 소수
      - `NaN`: 숫자가 아닌 값 (Not a Number)
      - `Infinity`: 무한대

      **C/Java와 비교**:
      - C: int, float, double 구분
      - JS: number 하나로 통합!

  - line: 2
    title: "문자열 타입 (string)"
    explanation: |
      **`let text = "Hello";`**

      **string**: 텍스트 데이터입니다.

      **3가지 따옴표**:
      - 큰따옴표: `"Hello"`
      - 작은따옴표: `'Hello'`
      - 백틱: `` `Hello ${name}` `` (템플릿 리터럴)

  - line: 3
    title: "불리언 타입 (boolean)"
    explanation: |
      **`let isActive = true;`**

      **boolean**: `true` 또는 `false` 두 값만 가집니다.

      **falsy 값** (false로 취급):
      - `false`, `0`, `""`, `null`, `undefined`, `NaN`

      나머지는 모두 **truthy** (true로 취급)

  - line: 5
    title: "typeof로 타입 확인"
    explanation: |
      **`console.log(typeof num);`**

      **typeof**: 값의 타입을 문자열로 반환합니다.

      **출력 결과**: `number`

  - line: 6
    title: "문자열 타입 확인"
    explanation: |
      **`console.log(typeof text);`**

      **출력 결과**: `string`

  - line: 7
    title: "불리언 타입 확인"
    explanation: |
      **`console.log(typeof isActive);`**

      **출력 결과**: `boolean`

  - line: 9
    title: "타입 변환 (type coercion)"
    explanation: |
      **`let result = num + "점";`**

      **숫자 + 문자열**: JavaScript는 자동으로 숫자를 문자열로 변환합니다!

      - `42 + "점"` → `"42" + "점"` → `"42점"`

      **자동 타입 변환(type coercion)**은 JS의 특징이자 주의점입니다.

  - line: 10
    title: "변환 결과 출력"
    explanation: |
      **`console.log(result);`**

      **출력 결과**: `42점`

      **주의 사항**:
      - `"3" + 2` = `"32"` (문자열 연결)
      - `"3" - 2` = `1` (숫자 연산)
      - `+` 연산자는 문자열 연결을 우선!

quiz:
  question: 'typeof null의 결과는?'
  options:
    - '"null"'
    - '"object"'
    - '"undefined"'
    - '"number"'
  correctIndex: 1
  explanation: |
    `typeof null`은 **"object"**를 반환합니다!

    이것은 JavaScript의 유명한 **버그**입니다.
    초기 구현의 실수이지만, 호환성을 위해 수정되지 않았습니다.

misconceptions:
  - wrong: "숫자 + 문자열은 에러가 발생한다"
    correct: "JavaScript는 자동 타입 변환으로 숫자를 문자열로 바꿔 연결합니다."
    why: "+는 문자열 연결 연산자로도 동작하며, 문자열이 있으면 연결을 우선합니다."

  - wrong: "null과 undefined는 같다"
    correct: "null은 의도적 빈 값, undefined는 값이 할당되지 않은 상태입니다."
    why: "null == undefined는 true이지만, null === undefined는 false입니다."

keyTakeaway: "number, string, boolean이 기본 타입. typeof로 확인. 자동 타입 변환(coercion) 주의."
