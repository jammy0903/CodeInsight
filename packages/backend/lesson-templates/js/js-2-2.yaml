lessonId: "js-2-2"
title: "스코프와 클로저"
concept: "스코프는 변수에 접근할 수 있는 범위입니다. 클로저는 함수가 자신의 스코프를 기억하는 것입니다."

code: |
  let greeting = "전역";

  function outer() {
      let outerVar = "외부";

      function inner() {
          let innerVar = "내부";
          console.log(greeting);
          console.log(outerVar);
          console.log(innerVar);
      }

      inner();
  }

  outer();

annotations:
  - line: 1
    title: "전역 변수"
    explanation: |
      **`let greeting = "전역";`**

      **전역 스코프**: 어디서든 접근 가능한 변수입니다.

      모든 함수에서 `greeting`에 접근할 수 있습니다.

  - line: 3
    title: "외부 함수"
    explanation: |
      **`function outer()`**

      outer 함수는 자신만의 **함수 스코프**를 가집니다.

  - line: 4
    title: "외부 함수의 변수"
    explanation: |
      **`let outerVar = "외부";`**

      outer 함수 안에서만 접근 가능한 지역 변수입니다.
      inner 함수에서도 접근 가능합니다 (스코프 체인).

  - line: 6
    title: "내부 함수 (클로저)"
    explanation: |
      **`function inner()`**

      **내부 함수**: outer 안에 정의된 함수입니다.

      inner는 자신의 스코프 + outer의 스코프 + 전역 스코프에 접근 가능합니다.
      이것이 **클로저(closure)**의 기본 개념입니다.

  - line: 8
    title: "전역 변수 접근"
    explanation: |
      **`console.log(greeting);`**

      **출력 결과**: `전역`

      **스코프 체인**: inner → outer → 전역 순으로 변수를 검색합니다.

  - line: 9
    title: "외부 함수 변수 접근"
    explanation: |
      **`console.log(outerVar);`**

      **출력 결과**: `외부`

      inner에서 outer의 변수에 접근 가능! 이것이 **클로저**입니다.

  - line: 10
    title: "자신의 변수 접근"
    explanation: |
      **`console.log(innerVar);`**

      **출력 결과**: `내부`

      자신의 스코프에 있는 변수에 직접 접근합니다.

quiz:
  question: "inner 함수 밖에서 innerVar에 접근하면?"
  options:
    - "정상 접근"
    - "undefined"
    - "ReferenceError"
    - "null"
  correctIndex: 2
  explanation: |
    `innerVar`는 inner 함수의 **지역 변수**입니다.

    함수 밖에서 접근하면 **ReferenceError: innerVar is not defined** 발생!

    **스코프 규칙**: 안쪽에서 바깥쪽 접근 O, 바깥에서 안쪽 접근 X

misconceptions:
  - wrong: "클로저는 특별한 문법이다"
    correct: "클로저는 함수가 자신이 생성된 스코프를 기억하는 JS의 자연스러운 동작입니다."
    why: "모든 함수는 자동으로 클로저를 형성합니다. 별도 문법이 필요하지 않습니다."

  - wrong: "함수가 종료되면 지역 변수는 항상 사라진다"
    correct: "클로저가 참조하는 변수는 함수 종료 후에도 유지됩니다."
    why: "내부 함수가 외부 변수를 참조하면, 가비지 컬렉터가 해당 변수를 제거하지 않습니다."

keyTakeaway: "스코프: 변수 접근 범위. 안→바깥 접근 O, 바깥→안 접근 X. 클로저: 함수가 외부 스코프를 기억."
