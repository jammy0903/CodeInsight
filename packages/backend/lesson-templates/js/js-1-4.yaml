lessonId: "js-1-4"
title: "객체 기초"
concept: "객체는 key-value 쌍으로 데이터를 저장합니다. JavaScript에서 가장 중요한 자료구조입니다."

code: |
  let person = {
      name: "Alice",
      age: 25,
      isStudent: true
  };

  console.log(person.name);
  console.log(person["age"]);

  person.email = "alice@example.com";
  console.log(person);

annotations:
  - line: 1
    title: "객체 생성"
    explanation: |
      **`let person = { ... };`**

      **객체(Object)**: 중괄호 `{}`로 생성합니다.

      - `name: "Alice"`: key가 "name", value가 "Alice"
      - `age: 25`: key가 "age", value가 25
      - `isStudent: true`: key가 "isStudent", value가 true

      **Python과 비교**:
      - Python: `person = {"name": "Alice"}` (딕셔너리, key에 따옴표)
      - JS: `person = {name: "Alice"}` (key에 따옴표 생략 가능)

  - line: 7
    title: "점 표기법으로 접근"
    explanation: |
      **`console.log(person.name);`**

      **점 표기법(dot notation)**: `객체.속성명`

      **출력 결과**: `Alice`

      가장 일반적인 속성 접근 방법입니다.

  - line: 8
    title: "대괄호 표기법으로 접근"
    explanation: |
      **`console.log(person["age"]);`**

      **대괄호 표기법(bracket notation)**: `객체["속성명"]`

      **출력 결과**: `25`

      **대괄호가 필요한 경우**:
      - 변수로 접근: `let key = "age"; person[key]`
      - 특수 문자 포함: `person["first-name"]`
      - 숫자 key: `person[0]`

  - line: 10
    title: "속성 추가"
    explanation: |
      **`person.email = "alice@example.com";`**

      객체에 **새 속성을 동적으로 추가**할 수 있습니다.

      **추가 전**: `{name, age, isStudent}`
      **추가 후**: `{name, age, isStudent, email}`

  - line: 11
    title: "전체 객체 출력"
    explanation: |
      **`console.log(person);`**

      **출력 결과**: `{ name: 'Alice', age: 25, isStudent: true, email: 'alice@example.com' }`

      email 속성이 추가된 것을 확인할 수 있습니다.

quiz:
  question: "let obj = {x: 1}; obj.y = 2; 실행 후 Object.keys(obj)의 결과는?"
  options:
    - '["x"]'
    - '["x", "y"]'
    - '["y"]'
    - "에러 발생"
  correctIndex: 1
  explanation: |
    `obj.y = 2`로 **새 속성이 추가**됩니다.

    `Object.keys(obj)`는 모든 key를 배열로 반환:
    **["x", "y"]**

misconceptions:
  - wrong: "객체의 속성은 생성 시에만 정할 수 있다"
    correct: "JavaScript 객체는 언제든 속성을 추가/삭제할 수 있습니다."
    why: "JS 객체는 동적이므로 런타임에 구조를 변경할 수 있습니다."

  - wrong: "점 표기법과 대괄호 표기법은 완전히 같다"
    correct: "대괄호 표기법은 변수, 특수문자 key를 사용할 수 있어 더 유연합니다."
    why: "점 표기법은 유효한 식별자만 사용 가능합니다."

keyTakeaway: "객체는 {key: value}로 생성. 점(.) 또는 대괄호([])로 접근. 속성 동적 추가/삭제 가능."
