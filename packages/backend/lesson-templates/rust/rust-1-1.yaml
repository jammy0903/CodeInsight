# Rust 레슨 1-1: 변수와 소유권 시작하기
lessonId: "rust-1-1"
title: "Rust 시작하기: 변수와 불변성"
concept: "Rust의 변수는 기본적으로 불변(immutable)입니다"

# 실행할 Rust 코드
code: |
  fn main() {
      // 불변 변수
      let x = 5;
      println!("x = {}", x);

      // 가변 변수
      let mut y = 10;
      println!("y = {}", y);
      y = 20;
      println!("y after change = {}", y);
  }

# 라인별 설명 (주석)
# 각 라인에서 학습자가 알아야 할 핵심 개념
annotations:
  - line: 3
    title: "불변 변수 선언"
    explanation: |
      **`let x = 5;`**

      Rust의 변수는 **기본적으로 불변(immutable)**입니다.
      한번 값을 할당하면 변경할 수 없습니다.

      **왜 불변을 기본으로 할까?**
      - 버그 방지 (의도치 않은 값 변경 차단)
      - 멀티스레드 안전성
      - 함수형 프로그래밍 스타일 장려

  - line: 4
    title: "값 출력하기"
    explanation: |
      **`println!` 매크로**

      `!`는 Rust의 **매크로(macro)**를 의미합니다.
      `{}`는 플레이스홀더로, 변수 값이 여기에 들어갑니다.

      **예시:**
      ```rust
      println!("x = {}", x);  // x = 5
      ```

  - line: 7
    title: "가변 변수 선언"
    explanation: |
      **`let mut y = 10;`**

      `mut` 키워드를 붙이면 **가변(mutable)** 변수가 됩니다.
      이제 값을 변경할 수 있습니다.

      **핵심:**
      - 기본은 불변 (`let`)
      - 필요할 때만 가변 (`let mut`)

  - line: 8
    title: "가변 변수 출력"
    explanation: |
      **`println!("y = {}", y);`**

      가변 변수도 일반 변수처럼 출력할 수 있습니다.
      현재 `y`는 `10`입니다.

  - line: 9
    title: "값 재할당"
    explanation: |
      **`y = 20;`**

      `mut` 키워드 덕분에 `y`의 값을 변경할 수 있습니다.

      **만약 `mut` 없이 시도하면?**
      ```rust
      let x = 5;
      x = 10;  // ❌ 컴파일 에러!
      ```

      Rust 컴파일러가 친절하게 알려줍니다:
      ```
      error: cannot assign twice to immutable variable
      ```

  - line: 10
    title: "변경된 값 확인"
    explanation: |
      **`println!("y after change = {}", y);`**

      이제 `y`는 `20`으로 변경되었습니다.

      **출력 결과:**
      ```
      x = 5
      y = 10
      y after change = 20
      ```

# 퀴즈
quiz:
  question: "Rust에서 변수의 기본 특성은?"
  options:
    - "기본적으로 가변(mutable)이며, const로 불변을 명시한다"
    - "기본적으로 불변(immutable)이며, mut로 가변을 명시한다"
    - "타입이 없는 동적 언어다"
    - "가비지 컬렉터가 자동으로 메모리를 관리한다"
  correctIndex: 1
  explanation: |
    Rust는 **안전성(safety)**을 최우선으로 합니다.
    변수를 기본적으로 불변으로 만들어 의도치 않은 값 변경을 방지합니다.

    필요할 때만 `mut` 키워드로 가변성을 명시하면 됩니다.

# 일반적인 오해들
misconceptions:
  - wrong: "let은 변수 선언, var는 상수 선언이다"
    correct: "Rust에는 var가 없습니다. let은 기본 불변, mut를 붙이면 가변입니다."
    why: "Rust는 안전성을 위해 기본을 불변으로 설정했습니다."

  - wrong: "불변 변수는 const와 같다"
    correct: "let은 런타임 값, const는 컴파일 타임 상수입니다."
    why: "const는 컴파일 시점에 값이 결정되어야 하지만, let은 런타임에 계산된 값을 받을 수 있습니다."

# 핵심 요약
keyTakeaway: "Rust는 기본 불변으로 안전성을 확보한다. 필요할 때만 mut로 가변성을 명시한다."
