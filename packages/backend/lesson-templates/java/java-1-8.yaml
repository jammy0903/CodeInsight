lessonId: "java-1-8"
title: "String 메서드"
concept: "String은 불변(immutable) 객체입니다. 메서드를 호출하면 새 String이 반환됩니다."

code: |
  String text = "Hello, World!";
  System.out.println("길이: " + text.length());
  System.out.println("대문자: " + text.toUpperCase());
  System.out.println("부분: " + text.substring(0, 5));
  System.out.println("포함: " + text.contains("World"));
  System.out.println("원본: " + text);

annotations:
  - line: 1
    title: "String 변수 선언"
    explanation: |
      **`String text = "Hello, World!";`**

      **String**: Java의 문자열 클래스

      - 큰따옴표(`" "`)로 감싸야 합니다
      - **불변(immutable)**: 한번 생성되면 값을 변경할 수 없습니다

  - line: 2
    title: "length() - 길이"
    explanation: |
      **`text.length()`**

      문자열의 **길이(문자 수)**를 반환합니다.

      **출력 결과**: `길이: 13`

      **주의**: 배열은 `arr.length` (필드), String은 `str.length()` (메서드)!

  - line: 3
    title: "toUpperCase() - 대문자 변환"
    explanation: |
      **`text.toUpperCase()`**

      모든 문자를 **대문자**로 변환한 **새 String**을 반환합니다.

      **출력 결과**: `대문자: HELLO, WORLD!`

      **원본은 변하지 않습니다!** (불변성)

  - line: 4
    title: "substring() - 부분 문자열"
    explanation: |
      **`text.substring(0, 5)`**

      인덱스 0부터 5 **미만**까지의 부분 문자열을 반환합니다.

      - `"Hello, World!"`에서 인덱스 0~4 → `"Hello"`

      **출력 결과**: `부분: Hello`

  - line: 5
    title: "contains() - 포함 여부"
    explanation: |
      **`text.contains("World")`**

      특정 문자열이 포함되어 있는지 **boolean**으로 반환합니다.

      **출력 결과**: `포함: true`

  - line: 6
    title: "원본 확인"
    explanation: |
      **`System.out.println("원본: " + text);`**

      **출력 결과**: `원본: Hello, World!`

      toUpperCase()를 호출했지만 **원본은 변하지 않았습니다!**
      String은 불변이므로 모든 메서드는 새 String을 반환합니다.

quiz:
  question: 'String s = "abc"; s.toUpperCase(); 후 s의 값은?'
  options:
    - '"ABC"'
    - '"abc"'
    - "null"
    - "컴파일 에러"
  correctIndex: 1
  explanation: |
    String은 **불변(immutable)**입니다.

    `s.toUpperCase()`는 새 String `"ABC"`를 **반환**하지만,
    s에 재할당하지 않았으므로 s는 여전히 **"abc"**입니다.

    변경하려면: `s = s.toUpperCase();`

misconceptions:
  - wrong: "String 메서드는 원본을 변경한다"
    correct: "String은 불변이므로 모든 메서드는 새 String을 반환합니다."
    why: "변경된 결과를 사용하려면 반환값을 변수에 저장해야 합니다."

  - wrong: "==로 String 내용을 비교할 수 있다"
    correct: "String 내용 비교에는 .equals()를 사용해야 합니다."
    why: "==는 참조(주소)를 비교하므로 내용이 같아도 false가 될 수 있습니다."

keyTakeaway: "String은 불변. 모든 메서드는 새 String 반환. length(), toUpperCase(), substring(), contains(). 비교는 .equals()."
