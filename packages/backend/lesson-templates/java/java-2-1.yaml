lessonId: "java-2-1"
title: "클래스와 객체"
concept: "클래스는 객체의 설계도입니다. 필드(데이터)와 메서드(동작)를 하나로 묶습니다."

code: |
  String dogName = "Buddy";
  int dogAge = 3;
  System.out.println(dogName + "는 " + dogAge + "살");

  String catName = "Nabi";
  int catAge = 2;
  System.out.println(catName + "는 " + catAge + "살");

annotations:
  - line: 1
    title: "첫 번째 데이터 그룹"
    explanation: |
      **`String dogName = "Buddy";`**

      개의 이름을 저장합니다.

      **문제점**: 관련된 데이터(이름, 나이)가 **분리**되어 있습니다.
      데이터가 많아지면 관리가 어려워집니다!

      **클래스가 필요한 이유**:
      ```
      // 클래스를 사용하면:
      class Dog {
          String name;
          int age;
      }
      Dog dog = new Dog();
      dog.name = "Buddy";
      dog.age = 3;
      ```

  - line: 2
    title: "나이 데이터"
    explanation: |
      **`int dogAge = 3;`**

      dogName과 dogAge는 **논리적으로 같은 개**에 대한 데이터이지만,
      코드에서는 별개의 변수입니다.

  - line: 3
    title: "출력"
    explanation: |
      **`System.out.println(dogName + "는 " + dogAge + "살");`**

      **출력 결과**: `Buddy는 3살`

  - line: 5
    title: "두 번째 데이터 그룹"
    explanation: |
      **`String catName = "Nabi";`**

      또 다른 동물의 데이터입니다.

      **변수가 계속 늘어남**: dog1Name, dog1Age, dog2Name, dog2Age...
      → **클래스(class)**로 묶으면 해결!

  - line: 7
    title: "두 번째 출력"
    explanation: |
      **`System.out.println(catName + "는 " + catAge + "살");`**

      **출력 결과**: `Nabi는 2살`

      **정리**: 관련된 데이터를 하나로 묶는 것이 **객체지향(OOP)**의 핵심입니다.

quiz:
  question: "클래스와 객체의 관계는?"
  options:
    - "같은 것이다"
    - "클래스는 설계도, 객체는 실체"
    - "객체는 설계도, 클래스는 실체"
    - "관련 없다"
  correctIndex: 1
  explanation: |
    **클래스 = 설계도** (붕어빵 틀)
    **객체 = 실체** (붕어빵)

    - 클래스: `class Dog { String name; int age; }`
    - 객체: `Dog buddy = new Dog();`

    하나의 클래스에서 **여러 객체**를 만들 수 있습니다!

misconceptions:
  - wrong: "클래스와 객체는 같다"
    correct: "클래스는 설계도이고, 객체는 그 설계도로 만든 실체(인스턴스)입니다."
    why: "Dog 클래스 하나로 buddy, max 등 여러 Dog 객체를 만들 수 있습니다."

  - wrong: "객체는 하나만 만들 수 있다"
    correct: "하나의 클래스에서 원하는 만큼 객체를 생성할 수 있습니다."
    why: "new 키워드로 매번 독립적인 새 객체를 생성합니다."

keyTakeaway: "클래스: 필드+메서드를 묶은 설계도. 객체: new로 생성한 실체. 관련 데이터를 하나로 관리."
