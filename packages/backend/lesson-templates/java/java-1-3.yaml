lessonId: "java-1-3"
title: "조건문 (if, else)"
concept: "Java의 조건문은 C와 유사합니다. boolean 타입만 조건으로 사용할 수 있습니다."

code: |
  int score = 85;

  if (score >= 90) {
      System.out.println("A등급");
  } else if (score >= 80) {
      System.out.println("B등급");
  } else {
      System.out.println("C등급");
  }

annotations:
  - line: 1
    title: "점수 변수"
    explanation: |
      **`int score = 85;`**

      정수 변수 score에 85를 저장합니다.

  - line: 3
    title: "첫 번째 조건"
    explanation: |
      **`if (score >= 90)`**

      **조건**: `85 >= 90` → **false**

      이 블록은 건너뜁니다.

      **Java vs C 차이점**:
      - C: `if (1)` 가능 (0이 아닌 값은 true)
      - Java: `if (1)` **불가!** (boolean만 허용)

  - line: 5
    title: "두 번째 조건 - 참!"
    explanation: |
      **`else if (score >= 80)`**

      **조건**: `85 >= 80` → **true!**

      이 블록이 실행됩니다.

  - line: 6
    title: "B등급 출력"
    explanation: |
      **`System.out.println("B등급");`**

      **출력 결과**: `B등급`

      나머지 else 블록은 건너뜁니다.

quiz:
  question: "Java에서 if (1) { ... }의 결과는?"
  options:
    - "항상 실행"
    - "실행 안 됨"
    - "컴파일 에러"
    - "런타임 에러"
  correctIndex: 2
  explanation: |
    Java는 if 조건에 **boolean 타입만** 허용합니다.

    `1`은 int이므로 **컴파일 에러** 발생!
    `if (true)` 또는 `if (score > 0)` 처럼 boolean 표현식이 필요합니다.

    C와 JavaScript는 숫자를 조건에 사용할 수 있지만, Java는 엄격합니다.

misconceptions:
  - wrong: "Java에서 0은 false, 1은 true이다"
    correct: "Java에서 boolean은 true/false만 가능하고, 숫자와 변환되지 않습니다."
    why: "Java는 타입 안전성을 중시하여 int와 boolean 간 자동 변환을 허용하지 않습니다."

  - wrong: "== 로 문자열을 비교할 수 있다"
    correct: "문자열 비교에는 .equals() 메서드를 사용해야 합니다."
    why: "==는 참조(주소)를 비교하고, .equals()는 내용을 비교합니다."

keyTakeaway: "Java if문은 boolean만 허용. 문자열 비교는 .equals() 사용. 타입 엄격."
