lessonId: "java-1-7"
title: "메서드와 매개변수"
concept: "Java는 값에 의한 전달(pass by value)입니다. 기본 타입은 복사, 참조 타입은 참조 복사됩니다."

code: |
  int a = 10;
  int b = 20;
  System.out.println("swap 전: a=" + a + ", b=" + b);

  int temp = a;
  a = b;
  b = temp;
  System.out.println("swap 후: a=" + a + ", b=" + b);

annotations:
  - line: 1
    title: "변수 선언"
    explanation: |
      **`int a = 10;`** / **`int b = 20;`**

      교환할 두 변수를 선언합니다.

      **Java의 메모리**:
      - 기본 타입은 **스택**에 직접 값을 저장
      - `a = 10`, `b = 20`이 스택에 저장됨

  - line: 3
    title: "교환 전 출력"
    explanation: |
      **`System.out.println("swap 전: a=" + a + ", b=" + b);`**

      **출력 결과**: `swap 전: a=10, b=20`

  - line: 5
    title: "임시 변수에 저장"
    explanation: |
      **`int temp = a;`**

      a의 값(10)을 임시 변수 temp에 저장합니다.

      **왜 temp가 필요한가?**
      `a = b`를 먼저 실행하면 a의 원래 값(10)이 사라집니다!

  - line: 6
    title: "a에 b 대입"
    explanation: |
      **`a = b;`**

      a = 20 (b의 값)

      **현재 상태**: a=20, b=20, temp=10

  - line: 7
    title: "b에 temp 대입"
    explanation: |
      **`b = temp;`**

      b = 10 (temp에 저장해둔 원래 a의 값)

      **교환 완료!** a=20, b=10

  - line: 8
    title: "교환 후 출력"
    explanation: |
      **`System.out.println("swap 후: a=" + a + ", b=" + b);`**

      **출력 결과**: `swap 후: a=20, b=10`

      **참고**: C에서는 포인터로 swap 함수를 만들 수 있지만,
      Java는 기본 타입을 참조로 전달할 수 없어서 메서드로 swap이 어렵습니다.

quiz:
  question: "Java에서 기본 타입(int)을 메서드에 전달하면?"
  options:
    - "참조가 전달된다"
    - "값이 복사되어 전달된다"
    - "주소가 전달된다"
    - "전달할 수 없다"
  correctIndex: 1
  explanation: |
    Java는 **항상 값에 의한 전달(pass by value)**입니다.

    - **기본 타입**: 값 자체가 복사됨 (메서드에서 변경해도 원본 불변)
    - **참조 타입**: 참조(주소)가 복사됨 (같은 객체를 가리킴)

misconceptions:
  - wrong: "Java는 참조에 의한 전달(pass by reference)을 지원한다"
    correct: "Java는 항상 값에 의한 전달입니다. 참조 타입도 참조 값의 복사본을 전달합니다."
    why: "메서드에서 매개변수에 새 객체를 할당해도 호출자의 변수는 변하지 않습니다."

  - wrong: "swap(a, b) 메서드로 기본 타입을 교환할 수 있다"
    correct: "Java에서 기본 타입은 값 복사이므로 swap 메서드로 교환할 수 없습니다."
    why: "메서드 안에서 매개변수를 변경해도 원본에 영향을 주지 않습니다."

keyTakeaway: "Java는 항상 pass by value. 기본 타입은 값 복사. 참조 타입은 참조 복사. swap은 직접 교환."
