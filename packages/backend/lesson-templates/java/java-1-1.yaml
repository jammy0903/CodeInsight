lessonId: "java-1-1"
title: "변수와 타입"
concept: "Java는 정적 타입 언어입니다. 변수 선언 시 타입을 명시해야 하며, 컴파일 시점에 타입이 검사됩니다."

code: |
  int x = 5;
  System.out.println("x = " + x);

  String name = "Alice";
  System.out.println("name = " + name);

  double pi = 3.14;
  System.out.println("pi = " + pi);

annotations:
  - line: 1
    title: "정수 변수 선언"
    explanation: |
      **`int x = 5;`**

      **Java 변수 선언**: `타입 변수명 = 값;`

      - `int`: 정수 타입 (4바이트, -2^31 ~ 2^31-1)
      - `x`: 변수 이름
      - `5`: 초기값

      **기본 타입(primitive types)**:
      - `byte`: 1바이트, `short`: 2바이트
      - `int`: 4바이트, `long`: 8바이트
      - `float`: 4바이트, `double`: 8바이트
      - `char`: 2바이트 (유니코드)
      - `boolean`: true/false

  - line: 2
    title: "System.out.println"
    explanation: |
      **`System.out.println("x = " + x);`**

      **System.out.println**: 콘솔에 출력하고 줄바꿈합니다.

      **문자열 연결**: `"x = " + x` → 문자열 + 정수 = 문자열
      자동으로 x가 문자열로 변환됩니다.

      **출력 결과**: `x = 5`

      **Python과 비교**:
      - Python: `print(f"x = {x}")`
      - Java: `System.out.println("x = " + x)`

  - line: 4
    title: "String 변수 선언"
    explanation: |
      **`String name = "Alice";`**

      **String**: 문자열 타입 (**참조 타입**)

      **기본 타입 vs 참조 타입**:
      - 기본 타입: `int`, `double`, `boolean` (소문자, 스택에 값 직접 저장)
      - 참조 타입: `String`, 배열, 클래스 (대문자, 힙에 저장, 스택에 참조)

  - line: 5
    title: "문자열 출력"
    explanation: |
      **`System.out.println("name = " + name);`**

      **출력 결과**: `name = Alice`

  - line: 7
    title: "실수 변수 선언"
    explanation: |
      **`double pi = 3.14;`**

      **double**: 8바이트 실수 타입 (소수점 이하 약 15자리 정밀도)

      **float vs double**:
      - `float`: 4바이트 (`float f = 3.14f;` ← f 접미사 필수)
      - `double`: 8바이트 (기본 실수 타입)

  - line: 8
    title: "실수 출력"
    explanation: |
      **`System.out.println("pi = " + pi);`**

      **출력 결과**: `pi = 3.14`

quiz:
  question: "int x; System.out.println(x); 의 결과는?"
  options:
    - "0 출력"
    - "컴파일 에러"
    - "null 출력"
    - "런타임 에러"
  correctIndex: 1
  explanation: |
    Java에서 **지역 변수는 초기화하지 않으면 사용할 수 없습니다**.

    **컴파일 에러**: `variable x might not have been initialized`

    **참고**: 클래스의 멤버 변수(필드)는 자동 초기화됩니다 (int → 0).

misconceptions:
  - wrong: "Java도 Python처럼 타입 없이 선언 가능하다"
    correct: "Java는 정적 타입 언어로 타입 명시가 필수입니다."
    why: "컴파일 시점에 타입을 검사하여 타입 안전성을 보장합니다."

  - wrong: "String은 기본 타입이다"
    correct: "String은 참조 타입(클래스)입니다."
    why: "String은 java.lang.String 클래스의 인스턴스이며, 힙에 저장됩니다."

  - wrong: "지역 변수도 자동 초기화된다"
    correct: "지역 변수는 반드시 명시적으로 초기화해야 합니다."
    why: "클래스 필드는 자동 초기화되지만, 메서드 안의 지역 변수는 초기화 필수입니다."

keyTakeaway: "Java는 정적 타입 언어. int, double(기본), String(참조). 지역 변수 초기화 필수."
