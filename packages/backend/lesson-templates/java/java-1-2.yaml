lessonId: "java-1-2"
title: "배열 기초"
concept: "Java 배열은 같은 타입의 데이터를 고정된 크기로 저장합니다. 인덱스는 0부터 시작합니다."

code: |
  int[] nums = {10, 20, 30};
  System.out.println("길이: " + nums.length);
  System.out.println("nums[0] = " + nums[0]);
  System.out.println("nums[2] = " + nums[2]);

  nums[1] = 99;
  System.out.println("변경 후 nums[1] = " + nums[1]);

annotations:
  - line: 1
    title: "배열 선언과 초기화"
    explanation: |
      **`int[] nums = {10, 20, 30};`**

      **배열 선언**: `타입[] 이름 = {초기값};`

      - `int[]`: int 타입 배열
      - `{10, 20, 30}`: 3개 요소로 초기화
      - 배열 크기는 **생성 시 고정** (변경 불가)

      **다른 선언 방법**:
      - `int[] arr = new int[5];` → 크기 5, 기본값 0
      - `int[] arr = new int[]{1, 2, 3};`

  - line: 2
    title: "배열 길이"
    explanation: |
      **`System.out.println("길이: " + nums.length);`**

      **length**: 배열의 길이를 반환하는 **필드**입니다.

      **출력 결과**: `길이: 3`

      **주의**: `length`는 메서드가 아니라 필드! (`()` 없음)
      - 배열: `arr.length` (필드)
      - String: `str.length()` (메서드)

  - line: 3
    title: "인덱스 접근"
    explanation: |
      **`System.out.println("nums[0] = " + nums[0]);`**

      인덱스는 **0부터 시작**합니다.

      **출력 결과**: `nums[0] = 10`

  - line: 4
    title: "마지막 요소"
    explanation: |
      **`System.out.println("nums[2] = " + nums[2]);`**

      **출력 결과**: `nums[2] = 30`

      **주의**: `nums[3]`에 접근하면 **ArrayIndexOutOfBoundsException** 발생!
      (C와 다르게 Java는 범위를 검사합니다)

  - line: 6
    title: "요소 변경"
    explanation: |
      **`nums[1] = 99;`**

      인덱스 1의 값을 20 → 99로 변경합니다.

  - line: 7
    title: "변경 확인"
    explanation: |
      **`System.out.println("변경 후 nums[1] = " + nums[1]);`**

      **출력 결과**: `변경 후 nums[1] = 99`

quiz:
  question: "new int[3]으로 생성한 배열의 초기값은?"
  options:
    - "null"
    - "0"
    - "undefined"
    - "랜덤 값"
  correctIndex: 1
  explanation: |
    Java에서 `new int[3]`으로 생성한 배열은 **기본값 0**으로 초기화됩니다.

    **타입별 기본값**:
    - 정수(`int`, `long`): 0
    - 실수(`double`, `float`): 0.0
    - `boolean`: false
    - 참조 타입(`String` 등): null

misconceptions:
  - wrong: "Java 배열 크기를 나중에 변경할 수 있다"
    correct: "Java 배열의 크기는 생성 시 고정됩니다."
    why: "크기 변경이 필요하면 ArrayList를 사용해야 합니다."

  - wrong: "배열 범위를 벗어나도 C처럼 접근 가능하다"
    correct: "Java는 배열 범위를 검사하여 ArrayIndexOutOfBoundsException을 발생시킵니다."
    why: "Java는 안전한 메모리 접근을 보장합니다."

keyTakeaway: "Java 배열: 타입[] 이름. 크기 고정. 인덱스 0부터. 범위 초과 시 예외 발생."
