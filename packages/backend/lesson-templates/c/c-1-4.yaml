lessonId: "c-1-4"
title: "조건문 (if, else)"
concept: "조건문은 조건에 따라 다른 코드를 실행합니다. 참이면 if 블록, 거짓이면 else 블록이 실행됩니다."

code: |
  #include <stdio.h>

  int main() {
      int score = 85;

      if (score >= 90) {
          printf("A등급\n");
      } else if (score >= 80) {
          printf("B등급\n");
      } else {
          printf("C등급\n");
      }

      return 0;
  }

annotations:
  - line: 4
    title: "점수 변수 선언"
    explanation: |
      **`int score = 85;`**

      정수 변수 `score`에 85를 저장합니다.

      이 값에 따라 어떤 등급이 출력될지 결정됩니다.

  - line: 6
    title: "첫 번째 조건 검사"
    explanation: |
      **`if (score >= 90)`**

      **조건**: `85 >= 90` → **거짓(false)**

      조건이 거짓이므로 이 블록은 **건너뜁니다**.
      다음 `else if`로 이동합니다.

      **C의 비교 연산자**:
      - `>=`: 크거나 같다
      - `<=`: 작거나 같다
      - `==`: 같다 (**= 아님!**)
      - `!=`: 같지 않다

  - line: 8
    title: "두 번째 조건 검사"
    explanation: |
      **`else if (score >= 80)`**

      **조건**: `85 >= 80` → **참(true)**

      조건이 참이므로 이 블록이 **실행됩니다**.

      **else if**: 이전 조건이 거짓일 때만 검사합니다.
      위에서 `score >= 90`이 거짓이었으므로 이 조건을 검사합니다.

  - line: 9
    title: "B등급 출력"
    explanation: |
      **`printf("B등급\n");`**

      `score >= 80` 조건이 참이므로 이 줄이 실행됩니다.

      **출력 결과**: `B등급`

      나머지 `else` 블록은 **건너뜁니다**.

quiz:
  question: "int x = 5; if (x = 10) { ... } 이 코드의 결과는?"
  options:
    - "x가 10이면 실행"
    - "항상 실행됨"
    - "컴파일 에러"
    - "항상 건너뜀"
  correctIndex: 1
  explanation: |
    **함정**: `x = 10`은 비교가 아니라 **대입**입니다!

    - `x = 10`: x에 10을 대입하고, 그 결과(10)를 반환
    - C에서 0이 아닌 값은 **참(true)**
    - 따라서 이 조건문은 **항상 실행**됩니다

    **올바른 비교**: `if (x == 10)` (등호 2개!)

misconceptions:
  - wrong: "if 문에서 = 로 비교할 수 있다"
    correct: "비교 연산자는 == 입니다. =는 대입 연산자입니다."
    why: "C에서 if(x = 10)은 대입 후 결과를 조건으로 사용하여 항상 참이 됩니다."

  - wrong: "else if 없이 if만 여러 개 쓰면 같다"
    correct: "if-else if는 첫 번째 참인 조건만 실행하고, if만 여러 개면 모두 검사합니다."
    why: "else if는 이전 조건이 거짓일 때만 검사하므로 효율적입니다."

keyTakeaway: "if-else if-else로 조건 분기. ==는 비교, =는 대입. 첫 번째 참인 조건만 실행."
