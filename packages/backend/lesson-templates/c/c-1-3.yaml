lessonId: "c-1-3"
title: "포인터 개념"
concept: "포인터는 메모리 주소를 저장하는 변수입니다. C의 핵심 개념이자 가장 강력한 도구입니다."

code: |
  #include <stdio.h>

  int main() {
      int x = 42;
      int *ptr = &x;

      printf("x의 값: %d\n", x);
      printf("x의 주소: %p\n", &x);
      printf("ptr의 값: %p\n", ptr);
      printf("ptr이 가리키는 값: %d\n", *ptr);

      return 0;
  }

annotations:
  - line: 4
    title: "일반 변수 선언"
    explanation: |
      **`int x = 42;`**

      정수 변수 `x`에 42를 저장합니다.

      **메모리 시각화**:
      ```
      주소: 0x7fff...de00
      이름: x
      값:   42
      크기: 4바이트
      ```

  - line: 5
    title: "포인터 변수 선언"
    explanation: |
      **`int *ptr = &x;`**

      **포인터**: 다른 변수의 **메모리 주소**를 저장하는 변수입니다.

      - `int *ptr`: int 타입을 가리키는 포인터 선언
      - `&x`: x의 메모리 주소 (& = 주소 연산자)
      - `ptr`에 x의 주소가 저장됩니다

      **메모리 시각화**:
      ```
      ptr → [x의 주소] ──→ x → [42]
      ```

  - line: 7
    title: "변수의 값 출력"
    explanation: |
      **`printf("x의 값: %d\n", x);`**

      **출력 결과**: `x의 값: 42`

      x를 직접 사용하면 저장된 **값(42)**을 가져옵니다.

  - line: 8
    title: "변수의 주소 출력"
    explanation: |
      **`printf("x의 주소: %p\n", &x);`**

      **& (주소 연산자)**: 변수의 메모리 주소를 반환합니다.
      **%p**: 주소를 16진수로 출력하는 형식 지정자

      **출력 결과**: `x의 주소: 0x7fff...` (실행마다 다름)

  - line: 9
    title: "포인터의 값 출력"
    explanation: |
      **`printf("ptr의 값: %p\n", ptr);`**

      ptr에 저장된 값은 **x의 주소**입니다.
      따라서 &x와 ptr은 같은 값을 출력합니다.

      **출력 결과**: `ptr의 값: 0x7fff...` (&x와 동일)

  - line: 10
    title: "역참조로 값 접근"
    explanation: |
      **`printf("ptr이 가리키는 값: %d\n", *ptr);`**

      **\* (역참조 연산자)**: 포인터가 가리키는 주소의 **값**을 가져옵니다.

      - `ptr` → x의 주소
      - `*ptr` → x의 주소에 저장된 값 → 42

      **출력 결과**: `ptr이 가리키는 값: 42`

      **정리**:
      - `x`: 값 (42)
      - `&x`: x의 주소
      - `ptr`: x의 주소 (= &x)
      - `*ptr`: x의 값 (= 42)

quiz:
  question: "int a = 10; int *p = &a; 일 때 *p의 값은?"
  options:
    - "a의 메모리 주소"
    - "10"
    - "p의 메모리 주소"
    - "컴파일 에러"
  correctIndex: 1
  explanation: |
    `*p`는 **역참조 연산자**입니다.

    p가 a의 주소를 저장하고 있으므로:
    - `*p` = p가 가리키는 주소의 값 = a의 값 = **10**

    `p`는 주소, `*p`는 그 주소의 값!

misconceptions:
  - wrong: "포인터와 일반 변수는 같다"
    correct: "포인터는 메모리 주소를 저장하고, 일반 변수는 데이터를 저장합니다."
    why: "포인터는 간접 참조를 통해 다른 변수의 값에 접근할 수 있는 특별한 변수입니다."

  - wrong: "*는 항상 곱셈이다"
    correct: "포인터 문맥에서 *는 역참조(dereference) 연산자입니다."
    why: "선언 시 `int *p`는 포인터 선언, 사용 시 `*p`는 역참조입니다."

  - wrong: "&는 AND 연산자다"
    correct: "단항 연산자 &는 변수의 메모리 주소를 반환하는 주소 연산자입니다."
    why: "이항 연산자 &는 비트 AND이지만, 단항 연산자 &는 주소 연산자입니다."

keyTakeaway: "포인터는 메모리 주소를 저장하는 변수. &는 주소 연산자, *는 역참조 연산자. ptr은 주소, *ptr은 값."
