lessonId: "c-2-2"
title: "포인터 연산"
concept: "포인터에 정수를 더하면 타입 크기만큼 주소가 이동합니다. 배열 순회에 활용됩니다."

code: |
  #include <stdio.h>

  int main() {
      int arr[3] = {10, 20, 30};
      int *ptr = arr;

      printf("ptr: %d\n", *ptr);
      printf("ptr+1: %d\n", *(ptr + 1));
      printf("ptr+2: %d\n", *(ptr + 2));

      return 0;
  }

annotations:
  - line: 4
    title: "배열 선언"
    explanation: |
      **`int arr[3] = {10, 20, 30};`**

      3개의 int가 연속된 메모리에 저장됩니다.

      ```
      주소     값
      0x100 → 10  (arr[0])
      0x104 → 20  (arr[1])
      0x108 → 30  (arr[2])
      ```

      각 int는 4바이트이므로 주소가 4씩 증가합니다.

  - line: 5
    title: "배열 이름은 포인터"
    explanation: |
      **`int *ptr = arr;`**

      **배열 이름은 첫 번째 요소의 주소**입니다!

      - `arr` = `&arr[0]` = 배열 시작 주소
      - `ptr`이 arr[0]을 가리킵니다

      ```
      ptr ──→ [10] [20] [30]
                ^
              arr[0]
      ```

  - line: 7
    title: "현재 위치의 값"
    explanation: |
      **`printf("ptr: %d\n", *ptr);`**

      `*ptr` = ptr이 가리키는 값 = arr[0] = 10

      **출력 결과**: `ptr: 10`

  - line: 8
    title: "포인터 + 1"
    explanation: |
      **`printf("ptr+1: %d\n", *(ptr + 1));`**

      **포인터 연산**: `ptr + 1`은 주소를 `sizeof(int)` (4바이트) 만큼 이동합니다.

      - `ptr`: arr[0]의 주소 (0x100)
      - `ptr + 1`: arr[1]의 주소 (0x104) ← 1이 아니라 4바이트 이동!
      - `*(ptr + 1)`: arr[1]의 값 = 20

      **출력 결과**: `ptr+1: 20`

      **핵심**: `*(ptr + i)` = `arr[i]`

  - line: 9
    title: "포인터 + 2"
    explanation: |
      **`printf("ptr+2: %d\n", *(ptr + 2));`**

      `ptr + 2` → 8바이트 이동 → arr[2]의 주소

      `*(ptr + 2)` = arr[2] = 30

      **출력 결과**: `ptr+2: 30`

quiz:
  question: "double *p; 일 때 p+1은 주소가 몇 바이트 이동?"
  options:
    - "1바이트"
    - "4바이트"
    - "8바이트"
    - "타입에 무관하게 1"
  correctIndex: 2
  explanation: |
    포인터 연산에서 +1은 **가리키는 타입의 크기**만큼 이동합니다.

    - `double`은 8바이트
    - `p + 1` = 주소 + 8바이트

    이것이 포인터 연산의 핵심입니다!

misconceptions:
  - wrong: "ptr + 1은 주소에 1을 더한다"
    correct: "ptr + 1은 가리키는 타입의 크기(sizeof)만큼 주소를 이동합니다."
    why: "int *ptr이면 +1은 4바이트, double *ptr이면 +1은 8바이트 이동합니다."

  - wrong: "배열 이름과 포인터는 완전히 같다"
    correct: "배열 이름은 상수 포인터처럼 동작하지만, sizeof와 & 연산에서 차이가 있습니다."
    why: "arr은 재할당 불가(arr = ptr 불가), sizeof(arr)은 전체 배열 크기를 반환합니다."

keyTakeaway: "포인터 +1은 타입 크기만큼 이동. *(ptr+i) = arr[i]. 배열 이름은 첫 요소의 주소."
