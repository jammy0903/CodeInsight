lessonId: "c-2-3"
title: "배열과 포인터"
concept: "C에서 배열과 포인터는 밀접한 관계입니다. 배열 인덱싱은 포인터 연산의 축약형입니다."

code: |
  #include <stdio.h>

  int main() {
      int arr[4] = {1, 2, 3, 4};

      printf("arr[2] = %d\n", arr[2]);
      printf("*(arr+2) = %d\n", *(arr + 2));

      int *ptr = &arr[1];
      printf("ptr[0] = %d\n", ptr[0]);
      printf("ptr[1] = %d\n", ptr[1]);

      return 0;
  }

annotations:
  - line: 4
    title: "배열 선언"
    explanation: |
      **`int arr[4] = {1, 2, 3, 4};`**

      4개 요소의 int 배열을 생성합니다.

      ```
      인덱스:  [0] [1] [2] [3]
      값:       1   2   3   4
      ```

  - line: 6
    title: "인덱스로 접근"
    explanation: |
      **`printf("arr[2] = %d\n", arr[2]);`**

      `arr[2]` = 3번째 요소 = 3

      **출력 결과**: `arr[2] = 3`

  - line: 7
    title: "포인터 연산으로 접근"
    explanation: |
      **`printf("*(arr+2) = %d\n", *(arr + 2));`**

      **핵심 등가식**: `arr[i]` = `*(arr + i)`

      - `arr + 2`: arr의 시작 주소에서 2칸(8바이트) 이동
      - `*(arr + 2)`: 그 주소의 값 = arr[2] = 3

      **출력 결과**: `*(arr+2) = 3`

      컴파일러는 실제로 `arr[i]`를 `*(arr + i)`로 변환합니다!

  - line: 9
    title: "배열 중간을 가리키는 포인터"
    explanation: |
      **`int *ptr = &arr[1];`**

      ptr이 **arr[1]의 주소**를 가리킵니다.

      ```
      arr: [1] [2] [3] [4]
                ^
              ptr 시작점
      ```

      ptr 입장에서는 arr[1]이 ptr[0]이 됩니다!

  - line: 10
    title: "포인터 기준 인덱싱 (0)"
    explanation: |
      **`printf("ptr[0] = %d\n", ptr[0]);`**

      ptr은 arr[1]을 가리키므로:
      - `ptr[0]` = arr[1] = 2

      **출력 결과**: `ptr[0] = 2`

  - line: 11
    title: "포인터 기준 인덱싱 (1)"
    explanation: |
      **`printf("ptr[1] = %d\n", ptr[1]);`**

      - `ptr[1]` = ptr 시작점에서 1칸 이동 = arr[2] = 3

      **출력 결과**: `ptr[1] = 3`

      **정리**: 포인터도 배열처럼 `[]` 인덱싱을 사용할 수 있습니다!

quiz:
  question: "int arr[3] = {10,20,30}; arr[1]과 같은 표현은?"
  options:
    - "*(arr)"
    - "*(arr + 1)"
    - "*(arr + 2)"
    - "&arr[1]"
  correctIndex: 1
  explanation: |
    **`arr[i]` = `*(arr + i)`** 가 핵심 등가식입니다.

    - `arr[1]` = `*(arr + 1)` = 20

    `&arr[1]`은 arr[1]의 **주소**이므로 값이 아닙니다.

misconceptions:
  - wrong: "포인터로는 배열의 [] 인덱싱을 사용할 수 없다"
    correct: "포인터도 []를 사용할 수 있습니다. ptr[i]는 *(ptr+i)와 같습니다."
    why: "C에서 []는 포인터 연산의 축약형이므로 포인터에도 동일하게 적용됩니다."

  - wrong: "arr[2]와 *(arr+2)는 다른 것이다"
    correct: "arr[2]와 *(arr+2)는 완전히 동일합니다."
    why: "컴파일러가 arr[i]를 내부적으로 *(arr+i)로 변환합니다."

keyTakeaway: "arr[i] = *(arr+i). 배열 인덱싱은 포인터 연산의 축약형. 포인터도 []로 인덱싱 가능."
