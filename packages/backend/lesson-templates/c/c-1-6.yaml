lessonId: "c-1-6"
title: "반복문 (while)"
concept: "while 문은 조건이 참인 동안 반복합니다. 반복 횟수가 미리 정해지지 않은 경우에 적합합니다."

code: |
  #include <stdio.h>

  int main() {
      int n = 1;

      while (n <= 4) {
          printf("n = %d\n", n);
          n = n * 2;
      }

      printf("최종 n = %d\n", n);

      return 0;
  }

annotations:
  - line: 4
    title: "초기값 설정"
    explanation: |
      **`int n = 1;`**

      while 문 이전에 반복 변수를 초기화합니다.

      **for 문과 차이**: for는 초기화가 내부에 있지만, while은 외부에서 초기화합니다.

  - line: 6
    title: "while 조건 검사"
    explanation: |
      **`while (n <= 4)`**

      **while 문**: 조건이 **참(true)**인 동안 블록을 반복합니다.

      현재 `n = 1`, `1 <= 4` → **참** → 블록 실행

      **주의**: 조건이 영원히 참이면 **무한 루프**!

  - line: 7
    title: "현재 값 출력"
    explanation: |
      **`printf("n = %d\n", n);`**

      **출력 결과** (첫 반복): `n = 1`

  - line: 8
    title: "값 2배 증가"
    explanation: |
      **`n = n * 2;`**

      n을 2배로 만듭니다.

      **반복 과정**:
      - 1회: n=1 출력, n=1×2=2
      - 2회: n=2 출력, n=2×2=4
      - 3회: n=4 출력, n=4×2=8
      - 검사: n=8, 8 <= 4 → **거짓** → 종료

  - line: 11
    title: "최종값 출력"
    explanation: |
      **`printf("최종 n = %d\n", n);`**

      while 문이 끝난 후의 n 값을 출력합니다.

      **출력 결과**: `최종 n = 8`

      n이 8이 되어 `8 <= 4`가 거짓이 되면서 반복이 종료되었습니다.

quiz:
  question: "while (1) { ... } 은 어떻게 동작하나요?"
  options:
    - "한 번 실행"
    - "실행 안 됨"
    - "무한 반복"
    - "컴파일 에러"
  correctIndex: 2
  explanation: |
    C에서 **1은 참(true)**, **0은 거짓(false)**입니다.

    `while (1)`은 조건이 항상 참이므로 **무한 반복**합니다.
    `break`문으로 탈출해야 합니다.

misconceptions:
  - wrong: "while과 for는 완전히 다른 것이다"
    correct: "while과 for는 표현 방식만 다를 뿐 동일한 반복을 할 수 있습니다."
    why: "for(; 조건;)은 while(조건)과 같습니다. 상황에 맞는 것을 선택하면 됩니다."

  - wrong: "while 문의 조건은 한 번만 검사된다"
    correct: "while 문의 조건은 매 반복 시작 전마다 검사됩니다."
    why: "조건이 거짓이 될 때까지 계속 검사하고, 거짓이면 루프를 종료합니다."

keyTakeaway: "while(조건)은 조건이 참인 동안 반복. 무한 루프 주의. 반복 변수를 외부에서 초기화하고 내부에서 변경."
