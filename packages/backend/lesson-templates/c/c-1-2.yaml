lessonId: "c-1-2"
title: "배열 기초"
concept: "배열은 같은 타입의 데이터를 연속된 메모리 공간에 저장하는 자료구조입니다."

code: |
  #include <stdio.h>

  int main() {
      int nums[3] = {10, 20, 30};
      printf("nums[0] = %d\n", nums[0]);
      printf("nums[1] = %d\n", nums[1]);
      printf("nums[2] = %d\n", nums[2]);

      nums[1] = 99;
      printf("변경 후 nums[1] = %d\n", nums[1]);

      return 0;
  }

annotations:
  - line: 4
    title: "배열 선언과 초기화"
    explanation: |
      **`int nums[3] = {10, 20, 30};`**

      **배열 선언**: `타입 이름[크기] = {초기값};`

      - `int`: 요소의 타입
      - `nums`: 배열 이름
      - `[3]`: 요소 3개짜리 배열
      - `{10, 20, 30}`: 초기값

      **메모리 배치** (연속 4바이트씩):
      ```
      주소    값
      [0]  →  10
      [1]  →  20
      [2]  →  30
      ```

      **Python과 비교**:
      - Python: `nums = [10, 20, 30]` (크기 자동, 타입 혼합 가능)
      - C: `int nums[3]` (크기 고정, 같은 타입만)

  - line: 5
    title: "배열 요소 접근: 인덱스 0"
    explanation: |
      **`printf("nums[0] = %d\n", nums[0]);`**

      배열 인덱스는 **0부터 시작**합니다.

      - `nums[0]` → 10 (첫 번째 요소)
      - `nums[1]` → 20 (두 번째 요소)
      - `nums[2]` → 30 (세 번째 요소)

      **출력 결과**: `nums[0] = 10`

  - line: 6
    title: "배열 요소 접근: 인덱스 1"
    explanation: |
      **`printf("nums[1] = %d\n", nums[1]);`**

      **출력 결과**: `nums[1] = 20`

  - line: 7
    title: "배열 요소 접근: 인덱스 2"
    explanation: |
      **`printf("nums[2] = %d\n", nums[2]);`**

      **출력 결과**: `nums[2] = 30`

      **주의**: `nums[3]`에 접근하면 **배열 범위를 벗어남** (정의되지 않은 동작!)
      C는 인덱스 범위를 자동으로 검사하지 않습니다.

  - line: 9
    title: "배열 요소 변경"
    explanation: |
      **`nums[1] = 99;`**

      배열의 특정 위치에 새 값을 대입할 수 있습니다.

      **변경 전**: `nums = {10, 20, 30}`
      **변경 후**: `nums = {10, 99, 30}`

      **메모리**: nums[1]의 주소에 저장된 값이 20 → 99로 바뀝니다.

  - line: 10
    title: "변경된 값 출력"
    explanation: |
      **`printf("변경 후 nums[1] = %d\n", nums[1]);`**

      **출력 결과**: `변경 후 nums[1] = 99`

quiz:
  question: "int arr[5];로 선언한 배열에서 유효한 인덱스 범위는?"
  options:
    - "1부터 5까지"
    - "0부터 4까지"
    - "0부터 5까지"
    - "1부터 4까지"
  correctIndex: 1
  explanation: |
    배열 인덱스는 **0부터 시작**합니다.

    `int arr[5]`는 5개 요소를 가지므로:
    - 유효한 인덱스: `arr[0]`, `arr[1]`, `arr[2]`, `arr[3]`, `arr[4]`
    - 범위: **0부터 4까지**

    `arr[5]`에 접근하면 배열 범위 초과! (undefined behavior)

misconceptions:
  - wrong: "배열 크기를 나중에 늘릴 수 있다"
    correct: "C 배열의 크기는 선언 시 고정됩니다."
    why: "컴파일 시점에 메모리 크기가 결정되므로 런타임에 변경할 수 없습니다. 동적 크기가 필요하면 malloc을 사용합니다."

  - wrong: "배열 범위를 벗어나면 에러가 발생한다"
    correct: "C는 배열 범위를 자동으로 검사하지 않습니다. 정의되지 않은 동작이 발생합니다."
    why: "성능을 위해 범위 검사를 하지 않습니다. 버퍼 오버플로우 버그의 원인이 됩니다."

keyTakeaway: "C 배열은 같은 타입, 고정 크기. 인덱스 0부터 시작. 범위 검사 없음 - 주의 필요."
