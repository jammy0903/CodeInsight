lessonId: "c-2-1"
title: "포인터 변수"
concept: "포인터로 다른 변수의 값을 간접적으로 읽고 변경할 수 있습니다."

code: |
  #include <stdio.h>

  int main() {
      int x = 10;
      int *ptr = &x;

      printf("변경 전: x = %d\n", x);

      *ptr = 20;
      printf("변경 후: x = %d\n", x);
      printf("*ptr = %d\n", *ptr);

      return 0;
  }

annotations:
  - line: 4
    title: "변수 선언"
    explanation: |
      **`int x = 10;`**

      정수 변수 x에 10을 저장합니다.

  - line: 5
    title: "포인터로 주소 저장"
    explanation: |
      **`int *ptr = &x;`**

      ptr이 x의 주소를 가리킵니다.

      ```
      ptr ──→ x (10)
      ```

  - line: 7
    title: "변경 전 값 확인"
    explanation: |
      **`printf("변경 전: x = %d\n", x);`**

      **출력 결과**: `변경 전: x = 10`

  - line: 9
    title: "역참조로 값 변경"
    explanation: |
      **`*ptr = 20;`**

      **역참조 대입**: 포인터가 가리키는 주소의 값을 변경합니다.

      - `*ptr = 20`: ptr이 가리키는 곳(= x)에 20을 저장
      - 결과: **x의 값이 10 → 20으로 변경됨**

      포인터를 통해 다른 변수의 값을 **간접적으로 수정**할 수 있습니다!

  - line: 10
    title: "변경 확인"
    explanation: |
      **`printf("변경 후: x = %d\n", x);`**

      **출력 결과**: `변경 후: x = 20`

      x를 직접 수정하지 않았지만, `*ptr = 20`을 통해 x의 값이 바뀌었습니다.

  - line: 11
    title: "포인터로 값 확인"
    explanation: |
      **`printf("*ptr = %d\n", *ptr);`**

      **출력 결과**: `*ptr = 20`

      `*ptr`과 `x`는 같은 메모리를 참조하므로 항상 같은 값입니다.

quiz:
  question: "int a = 5; int *p = &a; *p = 10; 실행 후 a의 값은?"
  options:
    - "5"
    - "10"
    - "0"
    - "컴파일 에러"
  correctIndex: 1
  explanation: |
    `*p = 10`은 p가 가리키는 곳(= a)에 10을 저장합니다.

    따라서 a의 값은 **10**으로 변경됩니다.

misconceptions:
  - wrong: "포인터로 값을 변경하면 원본은 그대로다"
    correct: "포인터 역참조로 값을 변경하면 원본 변수의 값이 직접 변경됩니다."
    why: "포인터는 원본의 주소를 가리키므로 *ptr은 원본 자체입니다."

  - wrong: "ptr = 20 으로 가리키는 값을 변경할 수 있다"
    correct: "ptr = 20은 포인터에 주소 20을 저장하는 것입니다. *ptr = 20이 올바른 방법입니다."
    why: "ptr은 주소를 저장하고, *ptr은 그 주소의 값입니다."

keyTakeaway: "*ptr로 포인터가 가리키는 값을 읽고 쓸 수 있다. *ptr = 값으로 간접 수정."
