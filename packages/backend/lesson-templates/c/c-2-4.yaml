lessonId: "c-2-4"
title: "포인터와 함수"
concept: "포인터를 매개변수로 전달하면 함수에서 원본 변수를 직접 수정할 수 있습니다."

code: |
  #include <stdio.h>

  void swap(int *a, int *b) {
      int temp = *a;
      *a = *b;
      *b = temp;
  }

  int main() {
      int x = 10;
      int y = 20;
      printf("swap 전: x=%d, y=%d\n", x, y);

      swap(&x, &y);
      printf("swap 후: x=%d, y=%d\n", x, y);

      return 0;
  }

annotations:
  - line: 3
    title: "포인터 매개변수 함수"
    explanation: |
      **`void swap(int *a, int *b)`**

      매개변수가 **포인터 타입** (`int *`)입니다.

      - `int *a`: int를 가리키는 포인터
      - `int *b`: int를 가리키는 포인터
      - `void`: 반환값 없음

      **왜 포인터를 사용할까?**
      일반 매개변수는 **값의 복사본**이므로 원본 수정 불가.
      포인터를 전달하면 **원본의 주소**를 알 수 있어 직접 수정 가능!

  - line: 4
    title: "임시 변수에 저장"
    explanation: |
      **`int temp = *a;`**

      `*a`는 포인터 a가 가리키는 값 (= x = 10)

      temp에 x의 값(10)을 임시 저장합니다.

  - line: 5
    title: "a에 b의 값 대입"
    explanation: |
      **`*a = *b;`**

      `*b`(= y = 20)를 `*a`(= x)에 저장합니다.

      **결과**: x가 20으로 변경됨

  - line: 6
    title: "b에 임시 값 대입"
    explanation: |
      **`*b = temp;`**

      temp(10)를 `*b`(= y)에 저장합니다.

      **결과**: y가 10으로 변경됨

      **교환 완료!** x=20, y=10

  - line: 10
    title: "main에서 변수 선언"
    explanation: |
      **`int x = 10;`** / **`int y = 20;`**

      교환할 두 변수를 선언합니다.

  - line: 12
    title: "swap 전 출력"
    explanation: |
      **`printf("swap 전: x=%d, y=%d\n", x, y);`**

      **출력 결과**: `swap 전: x=10, y=20`

  - line: 14
    title: "주소를 전달하며 함수 호출"
    explanation: |
      **`swap(&x, &y);`**

      - `&x`: x의 주소를 전달 → 매개변수 a가 x를 가리킴
      - `&y`: y의 주소를 전달 → 매개변수 b가 y를 가리킴

      **값이 아니라 주소를 전달**하므로 함수 안에서 원본을 수정할 수 있습니다!

  - line: 15
    title: "swap 후 출력"
    explanation: |
      **`printf("swap 후: x=%d, y=%d\n", x, y);`**

      **출력 결과**: `swap 후: x=20, y=10`

      포인터를 통해 x와 y의 값이 성공적으로 교환되었습니다!

quiz:
  question: "swap(x, y) 대신 swap(&x, &y)를 사용하는 이유는?"
  options:
    - "속도가 더 빠르다"
    - "원본 변수를 수정하려면 주소가 필요하다"
    - "포인터가 더 안전하다"
    - "C 문법 규칙이다"
  correctIndex: 1
  explanation: |
    C는 **값에 의한 전달(pass by value)**이 기본입니다.

    swap(x, y)로 호출하면 x, y의 **복사본**이 전달되어 원본은 변하지 않습니다.
    swap(&x, &y)로 **주소를 전달**해야 함수 안에서 원본을 수정할 수 있습니다.

misconceptions:
  - wrong: "C에서도 참조(reference)로 전달할 수 있다"
    correct: "C에는 참조(reference) 전달이 없습니다. 포인터로 흉내냅니다."
    why: "C++에는 참조(&)가 있지만, C는 포인터만으로 간접 접근을 구현합니다."

  - wrong: "포인터 매개변수는 원본 변수의 이름을 알고 있다"
    correct: "포인터는 단지 메모리 주소만 알고 있습니다."
    why: "포인터에는 주소만 저장되어 있으며, 어떤 변수의 주소인지 이름 정보는 없습니다."

keyTakeaway: "포인터 매개변수로 원본 수정 가능. 주소(&)를 전달하고, 역참조(*)로 값 접근. C의 핵심 패턴."
