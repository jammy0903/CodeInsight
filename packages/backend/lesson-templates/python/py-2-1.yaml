lessonId: "py-2-1"
title: "튜플 (Tuple)"
concept: "튜플은 불변(immutable) 리스트입니다. 소괄호 ()로 만들고, 한번 생성하면 변경할 수 없습니다."

code: |
  point = (3, 5)
  print(f"튜플: {point}")

  x = point[0]
  y = point[1]
  print(f"x={x}, y={y}")

  a, b = point
  print(f"언패킹: a={a}, b={b}")

annotations:
  - line: 1
    title: "튜플 생성"
    explanation: |
      **`point = (3, 5)`**

      **튜플(Tuple)**: 불변(immutable) 시퀀스 타입입니다.

      **구조**:
      - `( )`: 소괄호로 생성
      - `,`: 쉼표로 요소 구분
      - 예: `(3, 5)`, `("a", "b", "c")`

      **vs 리스트**:
      - 리스트: `[1, 2, 3]` - 가변 (변경 가능)
      - 튜플: `(1, 2, 3)` - 불변 (변경 불가)

  - line: 2
    title: "튜플 출력"
    explanation: |
      **`print(f"튜플: {point}")`**

      **출력 결과**: `튜플: (3, 5)`

  - line: 4
    title: "인덱스 접근 (첫 번째)"
    explanation: |
      **`x = point[0]`**

      **튜플 인덱싱**: 리스트처럼 대괄호로 접근합니다.

      **인덱스**:
      - `point[0]` → 첫 번째 요소 (3)
      - `point[1]` → 두 번째 요소 (5)
      - `point[-1]` → 마지막 요소 (5)

      **읽기만 가능**: `point[0] = 10` (에러! 변경 불가)

  - line: 5
    title: "인덱스 접근 (두 번째)"
    explanation: |
      **`y = point[1]`**

      두 번째 요소 (5)를 `y` 변수에 할당합니다.

  - line: 6
    title: "좌표 출력"
    explanation: |
      **`print(f"x={x}, y={y}")`**

      **출력 결과**: `x=3, y=5`

  - line: 8
    title: "튜플 언패킹"
    explanation: |
      **`a, b = point`**

      **언패킹(Unpacking)**: 튜플의 각 요소를 여러 변수에 한 번에 할당합니다.

      **동작**:
      - `point` → `(3, 5)`
      - `a` ← 첫 번째 요소 (3)
      - `b` ← 두 번째 요소 (5)

      **편리함**: 인덱스로 하나씩 꺼낼 필요 없음!

      **개수 주의**: 변수 개수와 튜플 요소 개수가 같아야 함

  - line: 9
    title: "언패킹 결과 출력"
    explanation: |
      **`print(f"언패킹: a={a}, b={b}")`**

      **출력 결과**: `언패킹: a=3, b=5`

      **튜플 활용**:
      - 좌표: `(x, y)`
      - RGB 색상: `(255, 0, 0)`
      - 여러 값 동시 반환: `return (result, status)`

quiz:
  question: "다음 코드의 결과는?"
  options:
    - "정상 실행"
    - "TypeError 발생"
    - "IndexError 발생"
    - "ValueError 발생"
  correctIndex: 1
  explanation: |
    코드: `t = (1, 2, 3)` → `t[0] = 10`

    **에러 발생**: `TypeError: 'tuple' object does not support item assignment`

    **이유**: 튜플은 불변(immutable)이므로 생성 후 요소를 변경할 수 없습니다.

    따라서 답은 **TypeError 발생**입니다!

misconceptions:
  - wrong: "튜플은 쓸모없는 읽기 전용 리스트다"
    correct: "튜플은 불변성이 보장되어야 할 때 유용합니다."
    why: "딕셔너리 키, 함수 다중 반환값, 데이터 무결성 보장 등에 사용됩니다."

  - wrong: "튜플은 항상 소괄호가 필요하다"
    correct: "쉼표만으로도 튜플이 생성됩니다."
    why: "`t = 1, 2, 3`도 튜플입니다. 소괄호는 가독성을 위해 권장될 뿐입니다."

  - wrong: "언패킹은 튜플에서만 가능하다"
    correct: "리스트, 문자열 등 모든 iterable에서 가능합니다."
    why: "`a, b = [1, 2]`, `x, y = 'AB'` 모두 가능합니다."

keyTakeaway: "튜플은 불변 시퀀스. 소괄호로 생성. 인덱스 접근 가능. 언패킹으로 여러 변수에 할당."
