lessonId: "py-1-2"
title: "리스트와 인덱싱"
concept: "리스트는 여러 값을 순서대로 저장하는 자료구조입니다. 인덱스로 각 요소에 접근할 수 있습니다."

code: |
  fruits = ["apple", "banana", "cherry"]
  print(f"전체 리스트: {fruits}")

  first = fruits[0]
  print(f"첫 번째: {first}")

  last = fruits[-1]
  print(f"마지막: {last}")

  fruits[1] = "mango"
  print(f"변경 후: {fruits}")

annotations:
  - line: 1
    title: "리스트 생성"
    explanation: |
      **`fruits = ["apple", "banana", "cherry"]`**

      **리스트(List)**: 여러 값을 순서대로 저장하는 자료구조입니다.

      - `[ ]`: 대괄호로 리스트를 만듭니다
      - 쉼표(`,`)로 요소를 구분합니다
      - 서로 다른 타입도 섞을 수 있습니다 (예: `[1, "hello", 3.14]`)

      **다른 언어와 비교**:
      - Java: `String[] fruits = {...}` (배열 크기 고정)
      - Python: `fruits = [...]` (리스트 크기 가변)

  - line: 2
    title: "리스트 전체 출력"
    explanation: |
      **`print(f"전체 리스트: {fruits}")`**

      리스트 변수를 그대로 출력하면 모든 요소가 대괄호 안에 표시됩니다.

      **출력 결과**: `전체 리스트: ['apple', 'banana', 'cherry']`

  - line: 4
    title: "인덱싱: 첫 번째 요소"
    explanation: |
      **`first = fruits[0]`**

      **인덱싱(Indexing)**: 리스트의 특정 위치 요소에 접근하는 방법입니다.

      - **인덱스는 0부터 시작!**
      - `fruits[0]`: 첫 번째 요소 ("apple")
      - `fruits[1]`: 두 번째 요소 ("banana")
      - `fruits[2]`: 세 번째 요소 ("cherry")

      **왜 0부터 시작할까?**
      - 메모리 주소 계산이 효율적이기 때문입니다
      - 대부분의 프로그래밍 언어가 0부터 시작합니다

  - line: 5
    title: "첫 번째 요소 출력"
    explanation: |
      **`print(f"첫 번째: {first}")`**

      **출력 결과**: `첫 번째: apple`

  - line: 7
    title: "음수 인덱싱: 마지막 요소"
    explanation: |
      **`last = fruits[-1]`**

      **음수 인덱싱**: 뒤에서부터 세는 방법입니다.

      - `fruits[-1]`: 마지막 요소 ("cherry")
      - `fruits[-2]`: 뒤에서 두 번째 ("banana")
      - `fruits[-3]`: 뒤에서 세 번째 ("apple")

      **Python만의 편리한 기능!**
      - Python: `fruits[-1]` (간단!)
      - 다른 언어: `fruits[len(fruits) - 1]` (길이 계산 필요)

  - line: 8
    title: "마지막 요소 출력"
    explanation: |
      **`print(f"마지막: {last}")`**

      **출력 결과**: `마지막: cherry`

  - line: 10
    title: "요소 변경"
    explanation: |
      **`fruits[1] = "mango"`**

      **리스트는 가변(mutable)**: 생성 후에도 요소를 변경할 수 있습니다.

      - `fruits[1]`: 두 번째 요소 ("banana")
      - `= "mango"`: "mango"로 변경

      **변경 전**: `["apple", "banana", "cherry"]`
      **변경 후**: `["apple", "mango", "cherry"]`

  - line: 11
    title: "변경된 리스트 출력"
    explanation: |
      **`print(f"변경 후: {fruits}")`**

      **출력 결과**: `변경 후: ['apple', 'mango', 'cherry']`

      **가변 vs 불변**:
      - **가변(mutable)**: list, dict, set → 변경 가능
      - **불변(immutable)**: str, int, tuple → 변경 불가능
      - 예: 문자열 `text[0] = "H"` (에러 발생), 리스트 `lst[0] = 10` (성공)

quiz:
  question: "리스트 fruits = [10, 20, 30]에서 fruits[-2]의 값은?"
  options:
    - "10"
    - "20"
    - "30"
    - "에러 발생"
  correctIndex: 1
  explanation: |
    **음수 인덱싱**은 뒤에서부터 셉니다.

    - `fruits[-1]`: 마지막 요소 (30)
    - `fruits[-2]`: 뒤에서 두 번째 (20)
    - `fruits[-3]`: 뒤에서 세 번째 (10)

    따라서 답은 **20**입니다!

misconceptions:
  - wrong: "리스트 인덱스는 1부터 시작한다"
    correct: "Python 리스트 인덱스는 0부터 시작합니다."
    why: "대부분의 프로그래밍 언어가 0부터 시작합니다. 메모리 주소 계산이 효율적이기 때문입니다."

  - wrong: "fruits[3]으로 네 번째 요소를 추가할 수 있다"
    correct: "존재하지 않는 인덱스에 접근하면 IndexError가 발생합니다."
    why: "요소를 추가하려면 append(), insert() 메서드를 사용해야 합니다."

  - wrong: "음수 인덱스는 에러다"
    correct: "음수 인덱싱은 Python의 정상적인 기능입니다."
    why: "뒤에서부터 접근할 때 편리합니다. fruits[-1]은 마지막 요소입니다."

keyTakeaway: "리스트는 0부터 시작하는 인덱스로 접근. 음수 인덱스는 뒤에서부터. 리스트는 가변이므로 요소 변경 가능."
