lessonId: "py-2-4"
title: "딕셔너리 메서드"
concept: "딕셔너리는 keys(), values(), items() 등의 메서드로 키, 값, 키-값 쌍을 조회합니다."

code: |
  scores = {"Alice": 90, "Bob": 85, "Charlie": 95}
  print(f"딕셔너리: {scores}")

  keys = list(scores.keys())
  print(f"키 목록: {keys}")

  values = list(scores.values())
  print(f"값 목록: {values}")

  items = list(scores.items())
  print(f"키-값 쌍: {items}")

annotations:
  - line: 1
    title: "딕셔너리 생성"
    explanation: |
      **`scores = {"Alice": 90, "Bob": 85, "Charlie": 95}`**

      학생 이름(키)과 점수(값)를 저장한 딕셔너리입니다.

  - line: 2
    title: "딕셔너리 출력"
    explanation: |
      **`print(f"딕셔너리: {scores}")`**

      **출력 결과**: `딕셔너리: {'Alice': 90, 'Bob': 85, 'Charlie': 95}`

  - line: 4
    title: "keys() 메서드"
    explanation: |
      **`keys = list(scores.keys())`**

      **keys() 메서드**: 딕셔너리의 모든 키를 반환합니다.

      **반환 타입**: `dict_keys` 객체 (뷰 객체)
      - 리스트처럼 보이지만 리스트는 아님
      - `list()`로 변환하면 진짜 리스트가 됨

      **결과**: `["Alice", "Bob", "Charlie"]`

      **용도**: 모든 키를 순회하거나 검사할 때

  - line: 5
    title: "키 목록 출력"
    explanation: |
      **`print(f"키 목록: {keys}")`**

      **출력 결과**: `키 목록: ['Alice', 'Bob', 'Charlie']`

  - line: 7
    title: "values() 메서드"
    explanation: |
      **`values = list(scores.values())`**

      **values() 메서드**: 딕셔너리의 모든 값을 반환합니다.

      **반환 타입**: `dict_values` 객체

      **결과**: `[90, 85, 95]`

      **용도**: 평균 계산, 최대/최소값 찾기 등

  - line: 8
    title: "값 목록 출력"
    explanation: |
      **`print(f"값 목록: {values}")`**

      **출력 결과**: `값 목록: [90, 85, 95]`

      **활용 예시**: `sum(scores.values()) / len(scores)` → 평균

  - line: 10
    title: "items() 메서드"
    explanation: |
      **`items = list(scores.items())`**

      **items() 메서드**: 딕셔너리의 모든 키-값 쌍을 튜플로 반환합니다.

      **반환 타입**: `dict_items` 객체

      **결과**: `[("Alice", 90), ("Bob", 85), ("Charlie", 95)]`

      **각 요소는 튜플**: `(키, 값)` 형태

      **용도**: for 문으로 키와 값을 동시에 순회

  - line: 11
    title: "키-값 쌍 출력"
    explanation: |
      **`print(f"키-값 쌍: {items}")`**

      **출력 결과**: `키-값 쌍: [('Alice', 90), ('Bob', 85), ('Charlie', 95)]`

      **for 문 활용**:
      ```
      for name, score in scores.items():
          print(f"{name}: {score}")
      ```
      → 언패킹으로 키와 값을 동시에 사용

quiz:
  question: "다음 코드로 Alice의 점수를 출력하려면?"
  options:
    - "scores.keys()[0]"
    - "scores.values()[0]"
    - "scores['Alice']"
    - "scores.items()[0]"
  correctIndex: 2
  explanation: |
    딕셔너리에서 값을 가져오는 방법:
    - `scores['Alice']` → 90 (정답!)
    - `scores.keys()[0]` → 에러! (dict_keys는 인덱싱 불가)
    - `scores.values()[0]` → 에러! (dict_values는 인덱싱 불가)
    - `scores.items()[0]` → 에러! (dict_items는 인덱싱 불가)

    따라서 답은 **scores['Alice']**입니다!

misconceptions:
  - wrong: "keys()는 리스트를 반환한다"
    correct: "dict_keys 뷰 객체를 반환합니다."
    why: "뷰 객체는 딕셔너리와 연동되어 변화를 반영합니다. 리스트로 쓰려면 list()로 변환하세요."

  - wrong: "values()로 얻은 값은 인덱스로 접근 가능하다"
    correct: "dict_values는 인덱싱을 지원하지 않습니다."
    why: "뷰 객체는 순회(iteration)만 가능합니다. 인덱싱하려면 list()로 변환하세요."

  - wrong: "items()는 리스트의 리스트를 반환한다"
    correct: "items()는 튜플의 리스트를 반환합니다."
    why: "각 키-값 쌍은 `(키, 값)` 형태의 튜플입니다. `[(키1, 값1), (키2, 값2)]`"

keyTakeaway: "keys()는 키, values()는 값, items()는 (키,값) 튜플 반환. 뷰 객체이므로 list() 변환 가능."
