lessonId: "py-1-3"
title: "반복문 (for)"
concept: "for 문은 리스트나 범위의 각 요소를 순회하며 코드를 반복 실행합니다."

code: |
  numbers = [1, 2, 3]
  print(f"리스트: {numbers}")

  for num in numbers:
      print(f"현재 값: {num}")

  print("반복 종료")

  total = 0
  for i in [10, 20, 30]:
      total = total + i
      print(f"누적 합: {total}")

annotations:
  - line: 1
    title: "리스트 준비"
    explanation: |
      **`numbers = [1, 2, 3]`**

      반복할 리스트를 준비합니다.

      이 레슨에서는:
      - `for` 문으로 리스트의 각 요소를 순회합니다
      - 각 요소에 대해 같은 작업을 반복합니다

  - line: 2
    title: "리스트 출력"
    explanation: |
      **`print(f"리스트: {numbers}")`**

      **출력 결과**: `리스트: [1, 2, 3]`

  - line: 4
    title: "for 문 시작"
    explanation: |
      **`for num in numbers:`**

      **for 문**: 리스트의 각 요소를 하나씩 가져와서 반복 실행합니다.

      **구조**: `for 변수 in 리스트:` 다음에 들여쓰기된 코드 작성

      **동작 방식**:
      1. `numbers`의 첫 번째 요소 (1)을 `num`에 할당
      2. 들여쓰기된 코드 실행
      3. 다음 요소 (2)를 `num`에 할당
      4. 다시 실행
      5. 모든 요소를 다 처리할 때까지 반복

      **들여쓰기 중요!**
      - Python은 들여쓰기로 블록을 구분합니다
      - 들여쓰기된 코드만 반복됩니다

  - line: 5
    title: "반복 코드 실행 (1)"
    explanation: |
      **`print(f"현재 값: {num}")`**

      **첫 번째 반복** (num = 1):
      - **출력 결과**: `현재 값: 1`

      **두 번째 반복** (num = 2):
      - **출력 결과**: `현재 값: 2`

      **세 번째 반복** (num = 3):
      - **출력 결과**: `현재 값: 3`

      **총 3번 실행됩니다!**

  - line: 7
    title: "반복 종료 후"
    explanation: |
      **`print("반복 종료")`**

      for 문이 끝나면 다음 줄로 이동합니다.

      **출력 결과**: `반복 종료`

      **들여쓰기 확인**:
      - 이 줄은 들여쓰기가 없음 → for 문 밖
      - for 문이 완전히 끝난 후 한 번만 실행

  - line: 9
    title: "누적 합 초기화"
    explanation: |
      **`total = 0`**

      누적 합을 계산하기 위해 `total` 변수를 0으로 초기화합니다.

      **패턴**: 반복문에서 값을 누적할 때는 항상 초기값 설정이 필요합니다.

  - line: 10
    title: "누적 합 계산 반복"
    explanation: |
      **`for i in [10, 20, 30]:`**

      리스트를 직접 쓸 수도 있습니다.

      **동작**:
      1. 첫 번째 반복: i = 10
      2. 두 번째 반복: i = 20
      3. 세 번째 반복: i = 30

  - line: 11
    title: "누적 합 계산"
    explanation: |
      **`total = total + i`**

      **누적 패턴**: 기존 값에 새 값을 더해서 다시 저장합니다.

      **실행 과정**:
      - 첫 번째 반복 (i=10): `total = 0 + 10` → total = 10
      - 두 번째 반복 (i=20): `total = 10 + 20` → total = 30
      - 세 번째 반복 (i=30): `total = 30 + 30` → total = 60

      **단축 표현**: `total += i` (total = total + i와 동일)

  - line: 12
    title: "누적 합 출력"
    explanation: |
      **`print(f"누적 합: {total}")`**

      매 반복마다 현재까지의 누적 합을 출력합니다.

      **출력 결과**: `누적 합: 10`, `누적 합: 30`, `누적 합: 60` (줄마다)

quiz:
  question: "다음 코드의 출력 결과는?"
  options:
    - "1"
    - "1\\n2\\n3"
    - "6"
    - "에러 발생"
  correctIndex: 1
  explanation: |
    코드: `for x in [1, 2, 3]: print(x)`

    **for 문은 각 요소마다 print를 실행**합니다.

    - 첫 번째 반복: print(1) → 1 출력
    - 두 번째 반복: print(2) → 2 출력
    - 세 번째 반복: print(3) → 3 출력

    따라서 답은 **1\\n2\\n3** (줄바꿈으로 구분)입니다!

misconceptions:
  - wrong: "for 문 다음 줄은 자동으로 반복된다"
    correct: "들여쓰기된 줄만 반복됩니다."
    why: "Python은 들여쓰기로 코드 블록을 구분합니다. 들여쓰기가 끝나면 for 문도 끝납니다."

  - wrong: "for num in numbers는 숫자만 가능하다"
    correct: "리스트의 모든 타입 요소를 순회할 수 있습니다."
    why: "for 문은 숫자뿐 아니라 문자열, 딕셔너리 등 모든 iterable 객체를 순회할 수 있습니다."

  - wrong: "total = total + i는 순환 참조 에러다"
    correct: "오른쪽을 먼저 계산한 후 왼쪽에 할당합니다."
    why: "= 는 할당 연산자입니다. 오른쪽 식을 먼저 평가한 후 그 결과를 왼쪽 변수에 저장합니다."

keyTakeaway: "for 문은 리스트 요소를 하나씩 가져와 반복. 들여쓰기로 반복 범위 결정. 누적 계산은 초기값 필수."
