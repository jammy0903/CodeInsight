# Python 레슨 템플릿 예제
# lessonId는 파일명과 일치해야 함 (py-1-1)

lessonId: "py-1-1"
title: "변수와 타입 기초"
concept: "Python은 동적 타입 언어입니다. 변수에 타입을 명시하지 않아도 됩니다."

# 실행할 Python 코드
code: |
  x = 5
  print(f"x = {x}")

  y = "Hello"
  print(f"y = {y}")

  z = 3.14
  print(f"z = {z}")

# 각 라인에 대한 설명 (annotation)
# line: 실행될 라인 번호
# title: 스텝 제목
# explanation: 상세 설명 (마크다운 지원)
annotations:
  - line: 1
    title: "정수 변수 선언"
    explanation: |
      **`x = 5`**

      Python에서 변수는 **타입 선언 없이** 바로 사용할 수 있습니다.

      - `x`: 변수 이름
      - `5`: 정수(int) 값
      - Python이 자동으로 타입을 추론합니다

      **다른 언어와 비교**:
      - Java: `int x = 5;` (타입 명시 필수)
      - Python: `x = 5` (타입 명시 불필요)

  - line: 2
    title: "f-string으로 출력"
    explanation: |
      **`print(f"x = {x}")`**

      **f-string**: Python 3.6+에서 도입된 문자열 포매팅 방법입니다.

      - `f"..."`: f를 앞에 붙이면 f-string
      - `{x}`: 중괄호 안에 변수명을 넣으면 값이 들어감

      **출력 결과**: `x = 5`

  - line: 4
    title: "문자열 변수 선언"
    explanation: |
      **`y = "Hello"`**

      같은 변수 `y`에 이번에는 **문자열(str)** 값을 할당합니다.

      **Python의 동적 타입**:
      - 변수의 타입은 할당되는 값에 따라 결정됨
      - 같은 변수에 다른 타입 값 할당 가능
      - 예: `x = 5` (int) → `x = "Hi"` (str로 변경 가능!)

  - line: 5
    title: "문자열 출력"
    explanation: |
      **`print(f"y = {y}")`**

      f-string은 문자열 변수도 똑같이 출력할 수 있습니다.

      **출력 결과**: `y = Hello`

  - line: 7
    title: "실수 변수 선언"
    explanation: |
      **`z = 3.14`**

      실수(float) 값을 할당합니다.

      **Python의 숫자 타입**:
      - `int`: 정수 (예: 5, -10, 0)
      - `float`: 실수 (예: 3.14, -0.5)
      - `complex`: 복소수 (예: 1+2j)

  - line: 8
    title: "실수 출력"
    explanation: |
      **`print(f"z = {z}")`**

      실수 값도 f-string으로 출력합니다.

      **출력 결과**: `z = 3.14`

      **타입 확인하기**: `print(type(z))` → `<class 'float'>`

# 퀴즈
quiz:
  question: "Python에서 변수 선언 시 타입을 명시하지 않으면?"
  options:
    - "컴파일 에러 발생"
    - "런타임 에러 발생"
    - "자동으로 타입 추론됨"
    - "기본값 0으로 초기화됨"
  correctIndex: 2
  explanation: |
    Python은 **동적 타입 언어**입니다.
    변수에 할당되는 값을 보고 자동으로 타입을 추론합니다.

    따라서 타입 선언이 필요 없습니다!

# 흔한 오해
misconceptions:
  - wrong: "변수는 한 번 선언하면 타입을 바꿀 수 없다"
    correct: "Python에서는 같은 변수에 다른 타입 값을 재할당할 수 있습니다."
    why: "동적 타입 언어이기 때문입니다. 하지만 가독성을 위해 타입을 일관되게 유지하는 것이 좋습니다."

  - wrong: "print(f\"x = {x}\")에서 f를 빼도 동작한다"
    correct: "f를 빼면 {x}가 그대로 출력됩니다."
    why: "f-string이 아니면 중괄호는 일반 문자로 취급됩니다."

# 핵심 요약
keyTakeaway: "Python은 동적 타입 언어. 변수 선언 시 타입을 명시하지 않아도 자동으로 추론됩니다."
