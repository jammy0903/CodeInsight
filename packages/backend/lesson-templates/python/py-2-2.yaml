lessonId: "py-2-2"
title: "세트 (Set)"
concept: "세트는 중복을 허용하지 않는 집합 자료구조입니다. 중괄호 {}로 만들고, 순서가 없습니다."

code: |
  fruits = {"apple", "banana", "apple"}
  print(f"세트: {fruits}")

  fruits.add("cherry")
  print(f"추가 후: {fruits}")

  has_apple = "apple" in fruits
  print(f"apple 있음: {has_apple}")

annotations:
  - line: 1
    title: "세트 생성"
    explanation: |
      **`fruits = {"apple", "banana", "apple"}`**

      **세트(Set)**: 중복을 자동으로 제거하는 집합 자료구조입니다.

      **구조**:
      - `{ }`: 중괄호로 생성
      - `,`: 쉼표로 요소 구분
      - **중복 자동 제거**: `"apple"`이 2번 있지만 1개만 저장됨

      **vs 딕셔너리**:
      - 세트: `{"a", "b"}` - 값만
      - 딕셔너리: `{"a": 1, "b": 2}` - 키:값 쌍

  - line: 2
    title: "세트 출력"
    explanation: |
      **`print(f"세트: {fruits}")`**

      **출력 결과**: `세트: {'apple', 'banana'}` (순서는 랜덤)

      **중복 제거**: `"apple"`이 하나만 남음!

      **순서 없음**: 출력 순서는 실행마다 다를 수 있음

  - line: 4
    title: "요소 추가"
    explanation: |
      **`fruits.add("cherry")`**

      **add() 메서드**: 세트에 새 요소를 추가합니다.

      **동작**:
      - 새 요소면 → 추가됨
      - 이미 있으면 → 무시됨 (에러 없음)

      **예**:
      - `fruits.add("apple")` → 이미 있으므로 무시
      - `fruits.add("cherry")` → 새로 추가

  - line: 5
    title: "추가 후 출력"
    explanation: |
      **`print(f"추가 후: {fruits}")`**

      **출력 결과**: `추가 후: {'apple', 'banana', 'cherry'}` (순서 랜덤)

  - line: 7
    title: "멤버십 검사"
    explanation: |
      **`has_apple = "apple" in fruits`**

      **in 연산자**: 요소가 세트에 있는지 확인합니다.

      **반환값**:
      - 있으면 → `True`
      - 없으면 → `False`

      **이 경우**: `"apple"`이 있으므로 `True`

      **성능**: 세트는 검색이 매우 빠름 (O(1))

  - line: 8
    title: "검사 결과 출력"
    explanation: |
      **`print(f"apple 있음: {has_apple}")`**

      **출력 결과**: `apple 있음: True`

      **세트 활용**:
      - 중복 제거: `list(set([1, 1, 2, 3]))` → `[1, 2, 3]`
      - 빠른 검색: `x in my_set`
      - 집합 연산: 합집합, 교집합, 차집합

quiz:
  question: "다음 코드의 출력 결과는?"
  options:
    - "3"
    - "4"
    - "5"
    - "에러 발생"
  correctIndex: 0
  explanation: |
    코드: `s = {1, 2, 2, 3, 3, 3}` → `print(len(s))`

    **실행 과정**:
    1. 세트 생성 시 중복 자동 제거
    2. `{1, 2, 3}` (중복된 2, 3 제거)
    3. `len(s)` → 3

    따라서 답은 **3**입니다!

misconceptions:
  - wrong: "세트는 빈 중괄호 {}로 만든다"
    correct: "빈 중괄호 {}는 빈 딕셔너리입니다."
    why: "빈 세트는 `set()`으로 만듭니다. `{}`는 딕셔너리입니다."

  - wrong: "세트는 인덱스로 접근할 수 있다"
    correct: "세트는 순서가 없어서 인덱싱이 불가능합니다."
    why: "순서가 없으므로 `s[0]` 같은 접근은 에러입니다. for 문이나 in 연산자로 사용합니다."

  - wrong: "세트는 가변 타입도 저장할 수 있다"
    correct: "세트는 불변(immutable) 타입만 저장 가능합니다."
    why: "리스트, 딕셔너리는 세트에 넣을 수 없습니다. 문자열, 숫자, 튜플만 가능합니다."

keyTakeaway: "세트는 중복 없는 집합. 중괄호로 생성. 순서 없음. 빠른 검색. 불변 타입만 저장."
