lessonId: "py-1-5"
title: "함수 정의와 호출"
concept: "함수는 재사용 가능한 코드 블록입니다. def 키워드로 정의하고, 이름으로 호출합니다."

code: |
  def greet(name):
      message = f"Hello, {name}!"
      return message

  result = greet("Python")
  print(f"결과: {result}")

annotations:
  - line: 1
    title: "함수 정의"
    explanation: |
      **`def greet(name):`**

      **함수 정의**: `def` 키워드로 재사용 가능한 코드 블록을 만듭니다.

      **구조**: `def 함수이름(매개변수):` 다음에 들여쓰기된 코드 작성

      **용어 정리**:
      - `def`: define(정의하다)의 약자
      - `greet`: 함수 이름
      - `name`: 매개변수(parameter) - 함수가 받을 값

      **이 시점**: 함수가 정의만 되고, 아직 실행되지 않음

  - line: 2
    title: "함수 본문"
    explanation: |
      **`message = f"Hello, {name}!"`**

      **함수 본문**: 들여쓰기된 코드는 함수가 호출될 때 실행됩니다.

      **지역 변수**: `message`는 함수 안에서만 사용 가능한 변수입니다.

      **중요**: 이 코드는 아직 실행되지 않음! (함수 정의 단계)

  - line: 3
    title: "return 문"
    explanation: |
      **`return message`**

      **return**: 함수의 결과값을 반환합니다.

      **동작**:
      - 함수 실행을 종료
      - `message` 값을 호출한 곳으로 반환
      - return 이후 코드는 실행 안 됨

      **없으면?**: return이 없으면 `None` 반환

  - line: 5
    title: "함수 호출"
    explanation: |
      **`result = greet("Python")`**

      **함수 호출**: 함수 이름 뒤에 괄호를 붙여 실행합니다.

      **실행 흐름**:
      1. `greet("Python")` 호출
      2. `name` 매개변수에 `"Python"` 할당
      3. 함수 본문 실행 (line 2-3)
      4. `return message`로 값 반환
      5. 반환값이 `result`에 할당

      **값 전달**: `"Python"` → `name` → `message` → `result`

  - line: 6
    title: "결과 출력"
    explanation: |
      **`print(f"결과: {result}")`**

      **출력 결과**: `결과: Hello, Python!`

      **전체 흐름 요약**:
      1. 함수 정의 (line 1-3)
      2. 함수 호출 (line 5)
      3. 함수 실행 → 값 반환
      4. 결과 출력 (line 6)

quiz:
  question: "다음 코드에서 출력 결과는?"
  options:
    - "5"
    - "10"
    - "15"
    - "에러 발생"
  correctIndex: 2
  explanation: |
    코드: `def add(x, y): return x + y` → `print(add(5, 10))`

    **실행 과정**:
    1. `add(5, 10)` 호출
    2. `x = 5`, `y = 10` 할당
    3. `return 5 + 10` → 15 반환
    4. `print(15)` → 15 출력

    따라서 답은 **15**입니다!

misconceptions:
  - wrong: "함수를 정의하면 자동으로 실행된다"
    correct: "함수는 정의 후 반드시 호출해야 실행됩니다."
    why: "def는 함수를 '정의'만 합니다. 호출(함수이름())을 해야 실행됩니다."

  - wrong: "return 없이도 값을 받을 수 있다"
    correct: "return이 없으면 None이 반환됩니다."
    why: "명시적으로 return을 써야 원하는 값을 반환할 수 있습니다."

  - wrong: "함수 안의 변수는 밖에서도 사용 가능하다"
    correct: "함수 안의 지역 변수는 함수 밖에서 접근할 수 없습니다."
    why: "지역 변수는 함수가 실행되는 동안만 존재합니다. 스코프(범위)가 다릅니다."

keyTakeaway: "함수는 def로 정의하고, 이름()으로 호출. return으로 값 반환. 함수 내부는 지역 스코프."
