lessonId: "py-2-3"
title: "리스트 컴프리헨션"
concept: "리스트 컴프리헨션은 간결하게 새 리스트를 만드는 문법입니다. [표현식 for 변수 in 반복가능객체]"

code: |
  numbers = [1, 2, 3, 4, 5]
  print(f"원본: {numbers}")

  squares = [x * x for x in numbers]
  print(f"제곱: {squares}")

  evens = [x for x in numbers if x % 2 == 0]
  print(f"짝수: {evens}")

annotations:
  - line: 1
    title: "원본 리스트"
    explanation: |
      **`numbers = [1, 2, 3, 4, 5]`**

      리스트 컴프리헨션을 적용할 원본 리스트입니다.

  - line: 2
    title: "원본 출력"
    explanation: |
      **`print(f"원본: {numbers}")`**

      **출력 결과**: `원본: [1, 2, 3, 4, 5]`

  - line: 4
    title: "리스트 컴프리헨션 (기본)"
    explanation: |
      **`squares = [x * x for x in numbers]`**

      **리스트 컴프리헨션**: 한 줄로 새 리스트를 생성합니다.

      **구조**: `[표현식 for 변수 in 반복가능객체]`

      **동작 과정**:
      1. `numbers`의 각 요소를 `x`에 할당
      2. `x * x` 계산
      3. 결과를 새 리스트에 추가

      **실행**:
      - x=1 → 1*1 = 1
      - x=2 → 2*2 = 4
      - x=3 → 3*3 = 9
      - x=4 → 4*4 = 16
      - x=5 → 5*5 = 25

      **결과**: `[1, 4, 9, 16, 25]`

  - line: 5
    title: "제곱 결과 출력"
    explanation: |
      **`print(f"제곱: {squares}")`**

      **출력 결과**: `제곱: [1, 4, 9, 16, 25]`

      **vs for 문**:
      ```
      squares = []
      for x in numbers:
          squares.append(x * x)
      ```
      → 컴프리헨션이 더 간결!

  - line: 7
    title: "조건부 컴프리헨션"
    explanation: |
      **`evens = [x for x in numbers if x % 2 == 0]`**

      **조건부 리스트 컴프리헨션**: if로 필터링합니다.

      **구조**: `[표현식 for 변수 in 반복가능객체 if 조건]`

      **동작 과정**:
      1. `numbers`의 각 요소를 `x`에 할당
      2. `x % 2 == 0` 조건 검사 (짝수인지?)
      3. 참이면 `x`를 새 리스트에 추가

      **실행**:
      - x=1 → 1%2==0? False → 제외
      - x=2 → 2%2==0? True → 추가
      - x=3 → 3%2==0? False → 제외
      - x=4 → 4%2==0? True → 추가
      - x=5 → 5%2==0? False → 제외

      **결과**: `[2, 4]`

  - line: 8
    title: "짝수 결과 출력"
    explanation: |
      **`print(f"짝수: {evens}")`**

      **출력 결과**: `짝수: [2, 4]`

      **요약**:
      - 기본형: `[x*2 for x in list]`
      - 조건부: `[x for x in list if x > 0]`
      - 변환+조건: `[x*2 for x in list if x > 0]`

quiz:
  question: "다음 코드의 출력 결과는?"
  options:
    - "[0, 1, 4]"
    - "[1, 4]"
    - "[0, 2, 4]"
    - "[2, 4]"
  correctIndex: 1
  explanation: |
    코드: `result = [x*x for x in [0, 1, 2] if x > 0]` → `print(result)`

    **실행 과정**:
    - x=0 → 0>0? False → 제외
    - x=1 → 1>0? True → 1*1=1 → 추가
    - x=2 → 2>0? True → 2*2=4 → 추가

    **결과**: `[1, 4]`

    따라서 답은 **[1, 4]**입니다!

misconceptions:
  - wrong: "컴프리헨션은 항상 for 문보다 빠르다"
    correct: "간단한 경우에만 빠르고, 복잡하면 오히려 느릴 수 있습니다."
    why: "가독성과 성능을 함께 고려해야 합니다. 너무 복잡한 컴프리헨션은 for 문이 나을 수 있습니다."

  - wrong: "if는 항상 마지막에 온다"
    correct: "필터링 if는 마지막, 조건부 표현식 if는 앞에 옵니다."
    why: "`[x for x in list if 조건]` (필터) vs `[x if 조건 else y for x in list]` (삼항)"

  - wrong: "중첩 for는 컴프리헨션으로 못 만든다"
    correct: "중첩 for도 가능하지만 가독성이 떨어집니다."
    why: "`[x*y for x in [1,2] for y in [3,4]]` → `[3,4,6,8]` 가능하지만 복잡함"

keyTakeaway: "리스트 컴프리헨션은 [표현식 for 변수 in 리스트] 형태. if로 필터링 가능. 간결하지만 복잡하면 for 문 사용."
