# ==================================================
# Fly.io Frontend Configuration
# ==================================================
app = "codeinsight-frontend"
primary_region = "nrt" # Tokyo

[build]
  dockerfile = "Dockerfile.frontend"
  [build.args]
    VITE_API_URL = "https://codeinsight-backend.fly.dev"

[env]
  PORT = "80"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "3s"
    path = "/"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
