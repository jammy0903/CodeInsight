services:
  # 백엔드 서비스 (Docker)
  - type: web
    name: codeinsight-backend
    runtime: docker
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: ADMIN_FIREBASE_UID
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false

  # 프론트엔드 서비스 (Docker + Nginx)
  - type: web
    name: codeinsight-frontend
    runtime: docker
    region: oregon
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: codeinsight-db
    region: oregon
    databaseName: codeinsight
    user: codeinsight
    plan: free
