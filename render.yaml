services:
  # Backend API Service
  - type: web
    name: c-osine-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: packages/backend
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: code-insight-2bb55
      - key: FIREBASE_PRIVATE_KEY_ID
        value: f1da8a6a5b1929a5ef4bae58f3c651a0f3a67de1
      - key: FIREBASE_CLIENT_EMAIL
        value: firebase-adminsdk-8xo3b@code-insight-2bb55.iam.gserviceaccount.com
      - key: FIREBASE_CLIENT_ID
        value: "109742867253803062062"
      - key: FIREBASE_AUTH_URI
        value: https://accounts.google.com/o/oauth2/auth
      - key: FIREBASE_TOKEN_URI
        value: https://oauth2.googleapis.com/token
      - key: FIREBASE_AUTH_PROVIDER_CERT_URL
        value: https://www.googleapis.com/oauth2/v1/certs
      - key: FIREBASE_CLIENT_CERT_URL
        value: https://www.googleapis.com/robot/v1/metadata/x509/firebase-adminsdk-8xo3b%40code-insight-2bb55.iam.gserviceaccount.com
      - key: FIREBASE_PRIVATE_KEY
        sync: false  # 민감 정보는 Render 대시보드에서 수동 설정
      - key: DATABASE_URL
        sync: false  # PostgreSQL 연결 후 설정
      - key: DEEPSEEK_API_KEY
        sync: false  # 대시보드에서 설정

  # Frontend Static Site
  - type: web
    name: c-osine-frontend
    runtime: node
    plan: starter
    region: oregon
    rootDir: packages/frontend
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: c-osine-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_APP_ENV
        value: production
      - key: VITE_FIREBASE_API_KEY
        sync: false  # 대시보드에서 설정
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: code-insight-2bb55.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: code-insight-2bb55
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: code-insight-2bb55.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "857622649476"
      - key: VITE_FIREBASE_APP_ID
        value: 1:857622649476:web:ad2b33e85a6dad87a08476
