services:
  # 백엔드 API 서비스
  - type: web
    name: codeinsight-backend
    runtime: node
    region: oregon
    buildCommand: |
      # Install Java (OpenJDK 17)
      apt-get update && apt-get install -y openjdk-17-jdk
      # Install dependencies and build
      cd packages/backend && pnpm install && pnpm build
    startCommand: cd packages/backend && pnpm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: CORS_ORIGINS
        value: https://codeinsight-frontend.onrender.com

  # 프론트엔드 정적 사이트
  - type: web
    name: codeinsight-frontend
    runtime: static
    region: oregon
    buildCommand: cd packages/frontend && pnpm install && pnpm build
    staticPublishPath: packages/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://codeinsight-backend.onrender.com
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false

databases:
  - name: codeinsight-db
    region: oregon
    databaseName: codeinsight
    user: codeinsight
    plan: free
