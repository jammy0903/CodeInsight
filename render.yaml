services:
  # Backend API Service
  - type: web
    name: c-osine-backend
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./packages/backend/Dockerfile
    dockerContext: ./
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false  # Set in Render dashboard
      - key: DATABASE_URL
        sync: false

  # Frontend Static Site
  - type: web
    name: c-osine-frontend
    runtime: node
    plan: starter
    region: oregon
    rootDir: packages/frontend
    buildCommand: pnpm install && pnpm --filter @codeinsight/shared build && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: c-osine-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_APP_ENV
        value: production
