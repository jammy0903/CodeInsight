services:
  # Backend API Service
  - type: web
    name: c-osine-backend
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./packages/backend/Dockerfile
    dockerContext: ./
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false  # Set in Render dashboard
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_CLIENT_ID
        sync: false
      - key: FIREBASE_AUTH_URI
        value: https://accounts.google.com/o/oauth2/auth
      - key: FIREBASE_TOKEN_URI
        value: https://oauth2.googleapis.com/token
      - key: FIREBASE_AUTH_PROVIDER_CERT_URL
        value: https://www.googleapis.com/oauth2/v1/certs
      - key: FIREBASE_CLIENT_CERT_URL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: ADMIN_FIREBASE_UID
        sync: false

  # Frontend Static Site
  - type: web
    name: c-osine-frontend
    runtime: node
    plan: starter
    region: oregon
    rootDir: packages/frontend
    buildCommand: pnpm install && pnpm --filter @codeinsight/shared build && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: c-osine-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_APP_ENV
        value: production
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
