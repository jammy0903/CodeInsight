services:
  # Backend API Service
  - type: web
    name: c-osine-backend-5z56
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./packages/backend/Dockerfile
    dockerContext: ./
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://codeinsight.online,https://www.codeinsight.online,https://c-osine-frontend-5z56.onrender.com
      - key: FIREBASE_PROJECT_ID
        value: code2u-78d63
      - key: FIREBASE_PRIVATE_KEY_ID
        value: REDACTED_PRIVATE_KEY_ID
      - key: FIREBASE_CLIENT_EMAIL
        value: REDACTED_SERVICE_ACCOUNT
      - key: FIREBASE_CLIENT_ID
        value: "REDACTED_CLIENT_ID"
      - key: FIREBASE_AUTH_URI
        value: https://accounts.google.com/o/oauth2/auth
      - key: FIREBASE_TOKEN_URI
        value: https://oauth2.googleapis.com/token
      - key: FIREBASE_AUTH_PROVIDER_CERT_URL
        value: https://www.googleapis.com/oauth2/v1/certs
      - key: FIREBASE_CLIENT_CERT_URL
        value: https://www.googleapis.com/robot/v1/metadata/x509/REDACTED_SERVICE_ACCOUNT
      - key: FIREBASE_PRIVATE_KEY
        sync: false  # 민감 정보는 Render 대시보드에서 수동 설정
      - key: DATABASE_URL
        sync: false  # PostgreSQL 연결 후 설정
      - key: DEEPSEEK_API_KEY
        sync: false  # 대시보드에서 설정
      - key: ADMIN_FIREBASE_UID
        value: REDACTED_ADMIN_UID

  # Frontend Static Site
  - type: web
    name: c-osine-frontend-5z56
    runtime: node
    plan: starter
    region: oregon
    rootDir: packages/frontend
    buildCommand: pnpm install && pnpm --filter @codeinsight/shared build && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: c-osine-backend-5z56
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_APP_ENV
        value: production
      - key: VITE_FIREBASE_API_KEY
        sync: false  # 대시보드에서 설정
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: code2u-78d63.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: code2u-78d63
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: code2u-78d63.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false  # Firebase Console에서 확인 필요
      - key: VITE_FIREBASE_APP_ID
        sync: false  # Firebase Console에서 확인 필요
