services:
  # ==========================================
  # Backend Service
  # ==========================================
  backend:
    container_name: codeinsight-backend
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped

    ports:
      - "3002:3002"

    environment:
      # Server
      - NODE_ENV=production
      - PORT=3002

      # Database (Neon)
      - DATABASE_URL=${DATABASE_URL}

      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}

      # C Execution Timeouts
      - C_RUN_DEFAULT_TIMEOUT=${C_RUN_DEFAULT_TIMEOUT:-10}
      - C_RUN_MAX_TIMEOUT=${C_RUN_MAX_TIMEOUT:-30}
      - C_EXECUTOR_BUFFER_SIZE=${C_EXECUTOR_BUFFER_SIZE:-10485760}

      # Code Limits
      - CODE_MAX_LENGTH=${CODE_MAX_LENGTH:-50000}
      - JSON_BODY_LIMIT=${JSON_BODY_LIMIT:-1mb}

    volumes:
      # Persistent data
      - backend-logs:/app/packages/backend/logs
      - backend-tmp:/app/packages/backend/tmp
      - backend-data:/app/packages/backend/data

    networks:
      - codeinsight-network

    depends_on:
      - frontend

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # Frontend Service (Nginx)
  # ==========================================
  frontend:
    container_name: codeinsight-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: production
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3002}
    restart: unless-stopped

    ports:
      - "80:80"

    networks:
      - codeinsight-network

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

# ==========================================
# Volumes
# ==========================================
volumes:
  backend-logs:
    driver: local
  backend-tmp:
    driver: local
  backend-data:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  codeinsight-network:
    driver: bridge
