# ========================================
# CodeInsight Docker Compose
# ========================================
# ⚠️  이 파일은 프로덕션 배포(service)용입니다.
#
# 개발(development) 환경에서는:
#   ./start-dev.sh 스크립트를 사용하세요!
#
# 자동 빌드:
#   Frontend: 소스 → npm install → npm run build → volume 저장
#   Backend: 소스 → npm install → npm run build → 실행
#
# 프로덕션 실행 (자동 빌드 포함):
#   docker compose up -d --build
#
# 중지:
#   docker compose down
# ========================================

version: '3.8'

services:
  # ===========================
  # Frontend: 빌드 전용
  # ===========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder  # Builder stage까지만 실행
    container_name: codeinsight-frontend-builder
    volumes:
      # 빌드 결과를 named volume에 저장
      - frontend-dist:/app/dist
    # 빌드 후 바로 종료 (Caddy가 volume 사용)
    command: ["sh", "-c", "echo 'Frontend build completed' && exit 0"]
    networks:
      - codeinsight

  # ===========================
  # Caddy: 웹 서버 + HTTPS
  # ===========================
  caddy:
    image: caddy:latest
    container_name: codeinsight-caddy
    ports:
      - "80:80"      # HTTP (자동으로 HTTPS로 리다이렉트)
      - "443:443"    # HTTPS
    volumes:
      # Caddy 설정 파일
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

      # Frontend 빌드 결과 (frontend 서비스에서 생성)
      - frontend-dist:/var/www/frontend:ro

      # 인증서 및 설정 저장 (영구 저장)
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    networks:
      - codeinsight

  # ===========================
  # Backend: Node.js API
  # ===========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeinsight-backend
    ports:
      - "3002:3002"  # 외부 노출 (개발 시 직접 접근용)
    environment:
      - NODE_ENV=production
    env_file:
      - ./backend/.env
    volumes:
      # C 코드 실행을 위한 Docker 소켓 마운트
      - /var/run/docker.sock:/var/run/docker.sock

      # 로그 저장 (선택적)
      - ./backend/logs:/app/logs
    restart: unless-stopped
    networks:
      - codeinsight

# ===========================
# Volumes (영구 데이터 저장)
# ===========================
volumes:
  # Frontend 빌드 결과 (frontend → caddy 공유)
  frontend-dist:
    driver: local

  # Caddy 데이터 (인증서 등)
  caddy_data:
    driver: local
  caddy_config:
    driver: local

# ===========================
# Networks
# ===========================
networks:
  codeinsight:
    driver: bridge
